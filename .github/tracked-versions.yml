# The internet-facing daemons. These terminate traffic from hostile networks, so
# they are the entries where a stale pin actually costs something. They were
# hardcoded in TypeScript, then moved into config so this file could reach them,
# and are back in TypeScript now that it can reach them there — the round trip
# left every one of them with a stale `.default()` shadowed by a live config
# value, which is the drift this form removes.

- app: Xray
  repo: XTLS/Xray-core
  file: packages/vpn/src/versions.ts
  key: xray
  value: "ghcr.io/xtls/xray-core:{version}"

# Releases are tagged "app/v2.10.0"; everything before the first digit is
# stripped, so the prefix costs nothing here.
- app: Hysteria2
  repo: apernet/hysteria
  file: packages/vpn/src/versions.ts
  key: hysteria
  value: "docker.io/tobyxdd/hysteria:v{version}"

- app: Tailscale
  repo: tailscale/tailscale
  file: packages/vpn/src/versions.ts
  key: tailscale
  value: "ghcr.io/tailscale/tailscale:v{version}"

# The egress side: ss-rust on an exit node. Tracked by nothing until the pin
# moved into the package — it had no config entry to name, so this file could
# not see it and it sat on whatever the schema default happened to say.
- app: ss-rust
  repo: shadowsocks/shadowsocks-rust
  file: packages/vpn/src/versions.ts
  key: ssRust
  value: "ghcr.io/shadowsocks/ssserver-rust:v{version}"

# The image repo and the release repo are different projects here: klutchell
# builds the container and cuts no GitHub releases, so it was unreadable and
# failed the whole run. Upstream tags "release-1.25.2", which normalises to the
# tag the image actually carries. The build lags upstream routinely, which the
# image check reports and holds the pin for — a warning, not a failure, since
# waiting is the only correct response to it.
- app: Unbound
  repo: NLnetLabs/unbound
  file: packages/vpn/src/versions.ts
  key: unbound
  value: "docker.io/klutchell/unbound:v{version}"

# What carries k3s upgrades to nodes Pulumi never installed. The controller
# itself is an ordinary component — it is the k3s version in the Plans it reads
# that is a judgement, not this.
- app: System Upgrade Controller
  repo: rancher/system-upgrade-controller
  file: packages/hetzner/src/versions.ts
  key: upgradeController
  value: "v{version}"
  image: "docker.io/rancher/system-upgrade-controller:v{version}"

# Deliberately absent, and each said so where it is pinned, in an `UNTRACKED`
# const beside the `VERSIONS` the updater does read: Hydra (a major bump needs
# a database migration), postgres and redis (major tags that carry their own
# patches), and blit (pinned to a build, because it cuts no releases).
#
# Also deliberately absent: k3s and Cilium. Cilium's version has to match the
# cluster's k8s minor, and k3s is the cluster — bumping either unattended
# changes the thing every other entry is deployed onto. They move by hand,
# together, with the compatibility matrix open — and CILIUM_K8S_SUPPORT fails
# the parse if a bump only moves one of them.
