# What the version updater watches. Adding a component is an entry here; the
# updater itself never needs touching.
#
#   repo   where the releases are read from
#   path   what to rewrite in Pulumi.main.yaml, as a list of keys. A mapping
#          segment like `{ id: tfl }` picks a list entry out by field rather
#          than by position, so reordering that list is harmless.
#   value  what to write, with {version} substituted
#   image  an image reference to confirm exists before committing the bump.
#          Defaults to `value` when that is already a full reference, so only
#          entries writing a bare tag need to spell it out. Omit entirely when
#          there is no image to check, as for a Helm chart.
#   tagPrefix
#          only consider releases whose tag starts with this. Needed when a repo
#          releases more than one thing — this one releases both its containers —
#          because "the latest release" is otherwise repo-wide, and an entry would
#          take the version of whatever released last.
#
# {version} is the release tag with everything before its first digit stripped,
# which covers both a leading `v` and a chart-name prefix. An entry puts back
# whatever form it actually needs — a bare version for a tag field, a full
# reference for an image.

- app: Navidrome
  repo: deluan/navidrome
  path: [config, "jaritanet:services", navidrome, args, image, tag]
  value: "{version}"
  image: "deluan/navidrome:{version}"

# Chart releases are tagged "traefik-34.5.0".
- app: Traefik
  repo: traefik/traefik-helm-chart
  path: [config, "jaritanet:traefik", chartVersion]
  value: "{version}"

# Our own containers, released from this repo when their version file changes —
# so a fix to the thing handing out everyone's sing-box profile reaches the
# cluster on the next updater run rather than when somebody remembers.
- app: serve-from-env
  repo: radiosilence/jaritanet
  tagPrefix: serve-from-env-v
  path: [config, "jaritanet:profiles", image]
  value: "ghcr.io/radiosilence/serve-from-env:{version}"

- app: Files
  repo: radiosilence/jaritanet
  tagPrefix: files-v
  path: [config, "jaritanet:services", files, args, image, tag]
  value: "{version}"
  image: "ghcr.io/radiosilence/jaritanet-files:{version}"

- app: MCP Gateway
  repo: radiosilence/mcp-gateway
  path: [config, "jaritanet:mcpGateway", image, tag]
  value: "v{version}"
  image: "ghcr.io/radiosilence/mcp-gateway:v{version}"

# The MCPs the gateway fronts, each an image reference inside a list.
- app: Fastmail MCP
  repo: radiosilence/fastmail-cli
  path: [config, "jaritanet:mcpGateway", mcps, { id: fastmail }, image]
  value: "ghcr.io/radiosilence/fastmail-cli:v{version}"

- app: CalDAV MCP
  repo: radiosilence/caldav-cli
  path: [config, "jaritanet:mcpGateway", mcps, { id: caldav }, image]
  value: "ghcr.io/radiosilence/caldav-cli:v{version}"

- app: Folk MCP
  repo: radiosilence/mainlynorfolk-mcp
  path: [config, "jaritanet:mcpGateway", mcps, { id: folk }, image]
  value: "ghcr.io/radiosilence/mainlynorfolk-mcp:v{version}"

- app: TfL MCP
  repo: radiosilence/tfl-mcp
  path: [config, "jaritanet:mcpGateway", mcps, { id: tfl }, image]
  value: "ghcr.io/radiosilence/tfl-mcp:v{version}"

# The internet-facing daemons. These terminate traffic from hostile networks,
# so they are the entries where a stale pin actually costs something — and all
# four were hardcoded in TypeScript until they moved into config so this file
# could reach them.

- app: Xray
  repo: XTLS/Xray-core
  path: [config, "jaritanet:gateway", xray, version]
  value: "v{version}"
  # The module strips the leading v — its image tags carry none.
  image: "ghcr.io/xtls/xray-core:{version}"

# Releases are tagged "app/v2.10.0"; everything before the first digit is
# stripped, so the prefix costs nothing here.
- app: Hysteria2
  repo: apernet/hysteria
  path: [config, "jaritanet:gateway", hysteria, image]
  value: "docker.io/tobyxdd/hysteria:v{version}"

- app: Tailscale
  repo: tailscale/tailscale
  path: [config, "jaritanet:gateway", tailnet, image]
  value: "ghcr.io/tailscale/tailscale:v{version}"

# The image repo and the release repo are different projects here: klutchell
# builds the container and cuts no GitHub releases, so it was unreadable and
# failed the whole run. Upstream tags "release-1.25.2", which normalises to the
# tag the image actually carries. The build lags upstream routinely, which the
# image check reports and holds the pin for — a warning, not a failure, since
# waiting is the only correct response to it.
- app: Unbound
  repo: NLnetLabs/unbound
  path: [config, "jaritanet:gateway", unbound, image]
  value: "docker.io/klutchell/unbound:v{version}"

# What carries k3s upgrades to nodes Pulumi never installed. The controller
# itself is an ordinary component — it is the k3s version in the Plans it reads
# that is a judgement, not this.
- app: System Upgrade Controller
  repo: rancher/system-upgrade-controller
  path: [config, "jaritanet:gateway", k3s, upgradeControllerVersion]
  value: "v{version}"
  image: "docker.io/rancher/system-upgrade-controller:v{version}"

# Deliberately absent: k3s and Cilium. Cilium's version has to match the
# cluster's k8s minor, and k3s is the cluster — bumping either unattended
# changes the thing every other entry is deployed onto. They move by hand,
# together, with the compatibility matrix open — and CILIUM_K8S_SUPPORT fails
# the parse if a bump only moves one of them.
