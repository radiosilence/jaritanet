name: CD jaritanet

permissions:
  contents: read
  # @radiosilence/mcp-gateway-pulumi comes from GitHub Packages.
  packages: read

on:
  workflow_dispatch:
    inputs:
      deleteUnreachable:
        description: >-
          Drop Kubernetes resources from state when their cluster is
          unreachable. For a cluster that has been replaced or retired — never
          for one that is merely down, since it deletes live resources from
          state.
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - .github/workflows/cd.yml
      - "packages/**"
      - "*.config.*"
      - package.json
  workflow_call:
    secrets:
      PULUMI_ACCESS_TOKEN:
        required: true

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: Deploy
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      (github.ref == 'refs/heads/main' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      # `.npmrc` names a token file rather than an ${ENV}, because aube refuses
      # to expand environment variables in auth settings a project controls.
      - name: Authenticate to GitHub Packages
        run: mise run auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      # Stack configuration, external-IP detection and the update itself all
      # happen inside deploy.ts, so preview.yml runs the identical code path.
      - name: Deploy
        working-directory: packages/infra
        run: pulumi up --yes --non-interactive --refresh -s "$STACK"
        env:
          STACK: radiosilence/jaritanet/main
          # The only value CI holds that the stack cannot, because it is what
          # reaches the stack in the first place.
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          # Drops Kubernetes resources from state when their cluster is gone.
          # An input rather than a default: left on, it would do the same to a
          # cluster that was only briefly unreachable.
          PULUMI_K8S_DELETE_UNREACHABLE: ${{ inputs.deleteUnreachable && 'true' || '' }}
