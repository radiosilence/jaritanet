name: Preview

# Runs `pulumi preview` on infra PRs and posts the diff as a PR comment, so
# changes can be reviewed against the live stack's state before merge — most
# importantly whether a resource *replaces* (e.g. the gateway VPS) versus
# updates in place. Read-only: preview never mutates the stack.

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    paths:
      - .github/workflows/preview.yml
      - "packages/**"
      - "*.config.*"
      - package.json

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Pulumi Preview
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Install Dependencies
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      # Identical entrypoint to the deploy in ci-cd.yml, differing only in the
      # verb — which is the point. Config is written to the checked-out
      # Pulumi.main.yaml, not the shared stack, so PRs can't leak into each
      # other's previews.
      - name: Preview
        run: aube run preview
        env:
          PREVIEW_COMMENT_PATH: ${{ runner.temp }}/preview.md
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          BLIT_HOSTNAME: ${{ secrets.BLIT_HOSTNAME }}
          NAVIDROME_HOSTNAME: ${{ secrets.NAVIDROME_HOSTNAME }}
          FILES_HOSTNAME: ${{ secrets.FILES_HOSTNAME }}
          MCP_HOSTNAME: ${{ secrets.MCP_HOSTNAME }}
          MCP_AUTH_HOSTNAME: ${{ secrets.MCP_AUTH_HOSTNAME }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          # The only secret the deploy had that this did not, which made every
          # preview run as a single implicit owner instead of the real roster —
          # so xray and hysteria configs differed and the diff showed each
          # user's credentials being replaced on a PR that touched neither. A
          # preview produced from different inputs than the deploy predicts
          # nothing, and a false credential rotation is the worst thing for it
          # to be wrong about, because the correct response to a real one is to
          # stop and think.
          VPN_USERS: ${{ secrets.VPN_USERS }}
          # Required by EnvSchema, so a preview without it fails before it can
          # produce a diff — and one produced from different inputs than the
          # deploy predicts nothing anyway.
          VPN_ENTRY_LABEL: ${{ secrets.VPN_ENTRY_LABEL }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          # Livepatch on the gateway and every edge. Free for personal use.
          UBUNTU_PRO_TOKEN: ${{ secrets.UBUNTU_PRO_TOKEN }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          SINGBOX_SLUG: ${{ secrets.SINGBOX_SLUG }}
          TAILNET_MAGICDNS_SUFFIX: ${{ secrets.TAILNET_MAGICDNS_SUFFIX }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          GH_ALLOWED: ${{ secrets.GH_ALLOWED }}

      # Edited in place rather than appended, so a PR pushed to repeatedly
      # carries one comment showing the current preview instead of a pile of
      # superseded ones.
      - name: Comment preview on PR
        run: gh pr comment "$PR" --body-file "$BODY" --edit-last --create-if-none
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.number }}
          BODY: ${{ runner.temp }}/preview.md
