name: Preview

# Runs `pulumi preview` on infra PRs and posts the diff as a PR comment, so
# changes can be reviewed against the live stack's state before merge — most
# importantly whether a resource *replaces* (e.g. the gateway VPS) versus
# updates in place. Read-only: preview never mutates the stack.

permissions:
  contents: read
  # @radiosilence/mcp-gateway-pulumi comes from GitHub Packages.
  packages: read
  pull-requests: write

on:
  pull_request:
    paths:
      - .github/workflows/preview.yml
      - "packages/**"
      - "*.config.*"
      - package.json

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Pulumi Preview
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      # `.npmrc` names a token file rather than an ${ENV}, because aube refuses
      # to expand environment variables in auth settings a project controls.
      - name: Authenticate to GitHub Packages
        run: mise run auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      # --refresh is load-bearing: without it a preview never calls the cloud
      # APIs, so a credential that has been revoked since the last deploy reads
      # as fine and only fails once it is too late to be a preview.
      - name: Preview
        working-directory: packages/infra
        run: |
          set -o pipefail
          pulumi preview --non-interactive --diff --refresh -s "$STACK" 2>&1 | tee preview.txt
        env:
          STACK: radiosilence/jaritanet/main
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # Truncated from the top: the resource summary a preview is read for sits
      # at the end, and GitHub refuses a body beyond 65536 characters.
      - name: Build comment
        if: always()
        run: |
          LIMIT=60000
          body=$(grep -vE '^(Downloading|Installing) plugin ' packages/infra/preview.txt)
          {
            echo '#### Pulumi preview — `radiosilence/jaritanet/main`'
            if [ "${#body}" -gt "$LIMIT" ]; then
              echo "> Truncated to the last $LIMIT characters — see the run for the whole preview."
            fi
            echo
            echo '```'
            printf '%s' "$body" | tail -c "$LIMIT"
            echo
            echo '```'
          } > "$BODY"
        env:
          BODY: ${{ runner.temp }}/preview.md

      # Edited in place rather than appended, so a PR pushed to repeatedly
      # carries one comment showing the current preview instead of a pile of
      # superseded ones.
      - name: Comment preview on PR
        if: always()
        run: gh pr comment "$PR" --body-file "$BODY" --edit-last --create-if-none
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.number }}
          BODY: ${{ runner.temp }}/preview.md
