name: Update App Versions

on:
  # main only. This job commits and pushes to whatever branch it runs on, so a
  # feature branch touching these paths got the day's version bumps written into
  # its own PR. Verify a change with `--dry-run` or workflow_dispatch instead.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-apps.yml"
      - ".github/tracked-versions.yml"
      - "scripts/update-apps/**"
  schedule:
    # Three times a day, not once: these entries now include the daemons
    # that terminate traffic from hostile networks, where the gap between a
    # fix publishing and it being deployed is the thing being minimised.
    - cron: "0 2,10,18 * * *"
  workflow_dispatch:

# One run at a time. Editing any of the tracked files triggers a run, and
# reaching for workflow_dispatch straight after starts a second; both would push
# to main. Queue rather than cancel — a cancelled run drops that day's updates
# instead of retrying them.
concurrency:
  group: update-apps
  cancel-in-progress: false

jobs:
  update-apps:
    name: Update tracked versions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      packages: read
    env:
      MISE_AUTO_INSTALL: "false"

    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Environment
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # mise.toml also carries Rust and Pulumi for other jobs; this one only
          # runs a Node script and, for dependency bumps, aube.
          install_args: node aube

      # `.npmrc` names a token file rather than an ${ENV}, because aube refuses
      # to expand environment variables in auth settings a project controls.
      - name: Authenticate to GitHub Packages
        run: mise run auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        uses: endevco/aube-action@395f4e7195b55541a2e67be6e66ac5884f844a9f # v1.1.1
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      - name: Update tracked versions
        run: mise run update:apps
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # The app installation can open an issue but is refused when amending
          # one, so closing uses the workflow's own token — this job already
          # grants that issues:write.
          ISSUE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
