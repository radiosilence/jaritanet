name: CI/CD

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      deleteUnreachable:
        description: >-
          Drop Kubernetes resources from state when their cluster is
          unreachable. For a cluster that has been replaced or retired — never
          for one that is merely down, since it deletes live resources from
          state.
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci-cd.yml
      - "packages/**"
      - "containers/**"
      - "*.config.*"
      - package.json
  pull_request:
    paths:
      - .github/workflows/ci-cd.yml
      - "packages/**"
      - "containers/**"
      - "*.config.*"
      - package.json
  workflow_call:
    secrets:
      PULUMI_ACCESS_TOKEN:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      HCLOUD_TOKEN:
        required: false
      SSH_PUBLIC_KEY:
        required: false
      TS_OAUTH_CLIENT_ID:
        required: true
      TS_OAUTH_SECRET:
        required: true
      BLIT_HOSTNAME:
        required: true
      TS_AUTHKEY:
        required: false
      VPN_USERS:
        required: false
      VPN_ENTRY_LABEL:
        required: true
      MCP_HOSTNAME:
        required: false
      MCP_AUTH_HOSTNAME:
        required: false
      GH_CLIENT_ID:
        required: false
      GH_CLIENT_SECRET:
        required: false
      GH_ALLOWED:
        required: false

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Install Dependencies
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      - name: Lint
        run: aube run lint

  format:
    name: Format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Install Dependencies
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      - name: Format Check
        run: aube run fmt:check

  typecheck:
    name: Type Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Install Dependencies
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      - name: Type Check
        run: aube run typecheck

  test:
    name: Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Install Dependencies
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      - name: Run Tests
        run: aube run test

      # The unit tests validate profile *shape* against sing-box's published
      # (latest) schema. This runs the real binary of the oldest core the fleet
      # is on, which is the only thing that answers "will the devices accept
      # this" — the question July's outage turned on.
      - name: Check profiles against the minimum sing-box core
        run: aube run check:profiles

  containers:
    name: Containers
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Check and Test
        working-directory: containers/serve-from-env
        run: cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --locked

  deploy:
    name: Deploy
    # Not `containers`: the deploy neither builds nor consumes the container
    # images — they are published by their own workflow and pinned by tag — so
    # gating on them would block infra deploys for an unrelated red.
    needs: [test, lint, format, typecheck]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      (github.ref == 'refs/heads/main' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Install Dependencies
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      # Stack configuration, external-IP detection and the update itself all
      # happen inside deploy.ts, so preview.yml runs the identical code path.
      - name: Deploy
        run: aube run deploy
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          PULUMI_K8S_DELETE_UNREACHABLE: ${{ inputs.deleteUnreachable && 'true' || '' }}
          BLIT_HOSTNAME: ${{ secrets.BLIT_HOSTNAME }}
          MCP_HOSTNAME: ${{ secrets.MCP_HOSTNAME }}
          MCP_AUTH_HOSTNAME: ${{ secrets.MCP_AUTH_HOSTNAME }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          # Break-glass admin key installed on the gateway and every edge, over
          # SSH rather than at creation so rotating it never replaces a box.
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          # Per-user VPN roster (RBAC). "jc+,guest1" → jc admin, guest1 guest.
          # Unset → single implicit owner-admin.
          VPN_USERS: ${{ secrets.VPN_USERS }}
          # Node label key marking a machine as a VPN entry. Read once and
          # passed to both the labelling command and every transport's
          # nodeSelector, so the two cannot drift apart.
          VPN_ENTRY_LABEL: ${{ secrets.VPN_ENTRY_LABEL }}
          # sing-box profiles: Pulumi generates them and serves them from the
          # cluster. Skipped if the slug or magicdns suffix is unset.
          SINGBOX_SLUG: ${{ secrets.SINGBOX_SLUG }}
          TAILNET_MAGICDNS_SUFFIX: ${{ secrets.TAILNET_MAGICDNS_SUFFIX }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # MCP gateway: GitHub OAuth app creds + login allowlist (read by
          # env.ts). Hostnames reach the program as stack config instead.
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          GH_ALLOWED: ${{ secrets.GH_ALLOWED }}
