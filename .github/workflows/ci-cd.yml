name: CI/CD

# Two halves in one run, so the second ships what the first built.
#
# CI checks the change and ends in `Checks`, the one status the ruleset
# requires. Each job runs only for the domains the change touches (see
# `changes`); a skipped job passes `Checks`, a failed or cancelled one fails
# it. Jobs can therefore be added, renamed or skipped without touching branch
# protection.
#
# CD runs on main after `Checks` has passed: `pulumi up` when the change
# reaches the stack, and for each container CI built, its `main` and `latest`
# tags moved onto the image CI pushed under the commit. A push that changes a
# container's version also tags that image with the version and cuts the
# `<app>-v<version>` release the updater (update-apps.yml) follows to move the
# pin.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deleteUnreachable:
        description: >-
          Drop Kubernetes resources from state when their cluster is
          unreachable. For a cluster that has been replaced or retired — never
          for one that is merely down, since it deletes live resources from
          state.
        type: boolean
        default: false

permissions:
  contents: read

# A pull request's newer push cancels its older run. Pushes to main queue in
# one group and are never cancelled once running: the run may be part-way
# through `pulumi up`, and an interrupted update leaves the stack locked with
# pending operations. A run still waiting when a newer push arrives is
# superseded by it, and loses nothing: `changes` diffs a push against the last
# commit whose run passed, so the newer run covers the older commit's changes,
# a version bump included. Queueing also keeps deploys in commit order, so an
# older tree never lands after a newer one. A manual run has a group of its
# own, so it is never superseded; its deploy still waits for any other.
concurrency:
  group: "ci-cd-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && 'main' || format('run-{0}', github.run_id) }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── CI ──────────────────────────────────────────────────────────────────

  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      deploy: ${{ steps.filter.outputs.deploy }}
      auth: ${{ steps.filter.outputs.auth }}
      serve_from_env: ${{ steps.filter.outputs.serve_from_env }}
      files: ${{ steps.filter.outputs.files }}
      rust: ${{ steps.filter.outputs.rust }}
      binaries: ${{ steps.filter.outputs.binaries }}
      images: ${{ steps.filter.outputs.images }}
      release: ${{ steps.filter.outputs.release }}
      releases: ${{ steps.filter.outputs.releases }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        # The domains a change touches, from its diff. A pull request's is
        # against its base. A push's is against the last commit on main whose
        # run passed, so a push whose run was superseded or failed still
        # reaches CD with the next; a re-run of that commit's own run diffs
        # against its parent. A manual run, a push whose base cannot be found,
        # or a diff that cannot be worked out, runs everything.
        #
        # Allowlists, so the question is "did any source of this domain
        # change?" rather than "was everything recognisably irrelevant?". The
        # cost is that a new top-level directory is invisible here until it is
        # added below. Markdown is documentation wherever it sits.
        #
        # Steps run under `bash -e`, where grep finding nothing is a failing
        # command rather than an answer, so every question is asked in a
        # condition.
        run: |
          ts=true deploy=true auth=true serve_from_env=true files=true

          base=HEAD^1
          if [ "$EVENT" = "push" ]; then
            base=
            passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-cd.yml --branch main --event push \
              --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
            if [ "$passed" = "$(git rev-parse HEAD)" ]; then
              base=HEAD^1
            elif [ -n "$passed" ] && git fetch -q --deepen=200 origin main && git merge-base --is-ancestor "$passed" HEAD; then
              base=$passed
            fi
          fi

          # Whether each container releases, the one answer every release job
          # reads, worked out before and apart from the domains. A pull request
          # releases nothing; one that changes a version is marked so it builds
          # that container. A push releases a container when it changes the
          # version and that version is not out yet. A manual run on main,
          # which is how a failed release is retried, releases whatever version
          # is not out yet.
          #
          # "Changes the version" is against the push's base, not its parent:
          # runs on main never overlap (see `concurrency`), so the base's run
          # has finished, and a release run that failed, or was superseded
          # while it waited, is released by the next run instead of dropped.
          version_of() {
            case $1 in
              files) git show "$2:apps/files/VERSION" 2>/dev/null | tr -d '[:space:]' ;;
              *) git show "$2:apps/$1/Cargo.toml" 2>/dev/null | sed -n 's/^version = "\(.*\)"/\1/p' | head -1 ;;
            esac
          }
          apps='[
            {"app": "auth", "image": "auth", "rust": true},
            {"app": "serve-from-env", "image": "serve-from-env", "rust": true},
            {"app": "files", "image": "jaritanet-files", "rust": false}
          ]'
          for app in $(jq -r '.[].app' <<< "$apps"); do
            version=$(version_of "$app" HEAD)
            if [ -z "$version" ]; then
              echo "::error::no version for $app"
              exit 1
            fi
            bumped=false
            if [ "$(version_of "$app" "${base:-HEAD^1}")" != "$version" ]; then
              bumped=true
            fi
            release=false
            case "$EVENT" in
              pull_request)
                release=$bumped
                ;;
              *)
                # Only a 404 means the version is not out. Any other failure
                # stops the run: guessing either way releases twice or never.
                if [ "$GITHUB_REF" = refs/heads/main ] && { [ "$EVENT" = workflow_dispatch ] || [ "$bumped" = true ]; }; then
                  if ! out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$app-v$version" 2>&1); then
                    case "$out" in
                      *"HTTP 404"*) release=true ;;
                      *)
                        echo "::error::cannot tell whether $app-v$version is released: $out"
                        exit 1
                        ;;
                    esac
                  fi
                fi
                ;;
            esac
            apps=$(jq -c --arg app "$app" --arg version "$version" --argjson release "$release" \
              'map(if .app == $app then . + {version: $version, release: $release} else . end)' <<< "$apps")
          done

          # Counted rather than `grep -q`, which can stop reading early and
          # fail the stage before it under pipefail.
          touches() { [ "$(printf '%s\n' "$changed" | grep -vE '\.md$' | grep -vE "${2:-^$}" | grep -cE "$1")" -gt 0 ]; }
          if [ "$EVENT" != "workflow_dispatch" ] && [ -n "$base" ] && changed=$(git diff --name-only "$base" HEAD); then
            echo "changes since $(git rev-parse --short "$base"):"
            printf '%s\n' "$changed" | sed 's/^/  /'
            # The lockfile and mise.toml count for a domain only when the
            # change reaches it. Unanswerable, they count.
            inputs=$(python3 .github/scripts/shared_inputs.py "$base" HEAD) || inputs=$'ts=true\ndeploy=true\nrust=true'
            eval "$(printf '%s\n' "$inputs" | sed 's/^/inputs_/')"

            # What the TypeScript checks read: the workspace, its scripts, the
            # vendored schema the tests validate against, and the tools'
            # configuration.
            touches '^packages/|^apps/[^/]+/deploy/|^scripts/|^schemas/|^(package\.json|tsconfig\.json|vitest\.config\.ts|\.oxlintrc\.json|\.oxfmtrc\.json|\.npmrc|aube-workspace\.yaml)$|^\.github/' \
              || [ "$inputs_ts" = true ] || ts=false
            # What `pulumi up` runs: the program and every package it imports,
            # and what decides how they install. Tests are not part of it. The
            # root package.json holds tooling; its runtime dependencies reach
            # the program through the lockfile, which shared_inputs.py follows.
            touches '^packages/|^apps/[^/]+/deploy/|^(\.npmrc|aube-workspace\.yaml)$|^\.github/' '\.test\.ts$' \
              || [ "$inputs_deploy" = true ] || deploy=false
            # A container is its app's directory, less the chart beside it: a
            # pin bump there is a deploy, not a new image.
            touches '^apps/auth/|^\.github/' '^apps/auth/deploy/' || [ "$inputs_rust" = true ] || auth=false
            touches '^apps/serve-from-env/|^\.github/' '^apps/serve-from-env/deploy/' || [ "$inputs_rust" = true ] || serve_from_env=false
            touches '^apps/files/|^\.github/' '^apps/files/deploy/' || files=false
          fi

          # A release builds what it ships, whatever the diff says.
          on=$(jq -c --argjson auth "$auth" --argjson sfe "$serve_from_env" --argjson files "$files" \
            'map(.app as $app | select(.release or ({"auth": $auth, "serve-from-env": $sfe, "files": $files} | .[$app])))' <<< "$apps")
          for app in $(jq -r '.[].app' <<< "$on"); do
            case $app in
              auth) auth=true ;;
              serve-from-env) serve_from_env=true ;;
              files) files=true ;;
            esac
          done
          {
            echo "ts=$ts"
            echo "deploy=$deploy"
            echo "auth=$auth"
            echo "serve_from_env=$serve_from_env"
            echo "files=$files"
            echo "rust=$(jq -c 'map(select(.rust))' <<< "$on")"
            echo "binaries=$(jq -c '[.[] | select(.rust) | {app} + (
              {arch: "amd64", runner: "ubuntu-24.04", target: "x86_64-unknown-linux-musl"},
              {arch: "arm64", runner: "ubuntu-24.04-arm", target: "aarch64-unknown-linux-musl"}
            )]' <<< "$on")"
            echo "images=$on"
            echo "release=$(jq -c 'any(.[]; .release)' <<< "$apps")"
            echo "releases=$(jq -c 'map(select(.release))' <<< "$apps")"
          } | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    permissions:
      contents: read
      # @radiosilence/*-pulumi come from GitHub Packages.
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          # What every TypeScript job runs on. Naming them is also what lets
          # shared_inputs.py tell a Rust or Pulumi bump in mise.toml from one
          # that reaches these jobs.
          install_args: node aube

      # `.npmrc` names a token file rather than an ${ENV}, because aube refuses
      # to expand environment variables in auth settings a project controls.
      - name: Authenticate to GitHub Packages
        run: mise run auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      - name: Lint
        run: mise run lint

  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install_args: node aube

      - name: Authenticate to GitHub Packages
        run: mise run auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      - name: Format Check
        run: mise run fmt:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install_args: node aube

      - name: Authenticate to GitHub Packages
        run: mise run auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      - name: Type Check
        run: mise run typecheck

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install_args: node aube

      - name: Authenticate to GitHub Packages
        run: mise run auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      - name: Run Tests
        run: mise run test

      # The unit tests validate profile *shape* against sing-box's published
      # (latest) schema. This runs the real binary of the oldest core the fleet
      # is on, which is the only thing that answers "will the devices accept
      # this" — the question July's outage turned on.
      - name: Check profiles against the minimum sing-box core
        run: mise run check:profiles

  # `pulumi preview --refresh` against the live stack, posted on the pull
  # request, so a resource that *replaces* (the gateway VPS) rather than
  # updates is seen before merge. --refresh is load-bearing: without it a
  # preview never calls the cloud APIs, so a credential revoked since the last
  # deploy reads as fine and only fails once it is too late to be a preview.
  # Read-only; the token it holds can comment and nothing more.
  preview:
    name: Pulumi Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.deploy == 'true'
    permissions:
      contents: read
      packages: read
      pull-requests: write
    env:
      STACK: radiosilence/jaritanet/main
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      # A pull request from a fork is given no secrets.
      - id: token
        run: |
          if [ -n "$PULUMI_ACCESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PULUMI_ACCESS_TOKEN is not available to this run; skipping the preview."
          fi

      - name: Checkout
        if: steps.token.outputs.ready == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        if: steps.token.outputs.ready == 'true'
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install_args: node aube pulumi

      - name: Authenticate to GitHub Packages
        if: steps.token.outputs.ready == 'true'
        run: mise run auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        if: steps.token.outputs.ready == 'true'
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      - name: Preview
        id: preview
        if: steps.token.outputs.ready == 'true'
        working-directory: packages/infra
        run: |
          set -o pipefail
          pulumi preview --non-interactive --diff --refresh -s "$STACK" 2>&1 | tee preview.txt

      # Truncated from the top: the resource summary a preview is read for sits
      # at the end, and GitHub refuses a body beyond 65536 characters.
      - name: Build comment
        if: ${{ !cancelled() && steps.preview.outcome != 'skipped' }}
        run: |
          LIMIT=60000
          body=$(grep -vE '^(Downloading|Installing) plugin ' packages/infra/preview.txt)
          {
            # The backticks are Markdown, for the comment.
            # shellcheck disable=SC2016
            echo '#### Pulumi preview — `radiosilence/jaritanet/main`'
            if [ "${#body}" -gt "$LIMIT" ]; then
              echo "> Truncated to the last $LIMIT characters — see the run for the whole preview."
            fi
            echo
            echo '```'
            printf '%s' "$body" | tail -c "$LIMIT"
            echo
            echo '```'
          } > "$BODY"
        env:
          BODY: ${{ runner.temp }}/preview.md

      # Edited in place rather than appended, so a PR pushed to repeatedly
      # carries one comment showing the current preview instead of a pile of
      # superseded ones.
      - name: Comment preview on PR
        if: ${{ !cancelled() && steps.preview.outcome != 'skipped' }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$BODY" --edit-last --create-if-none
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.number }}
          BODY: ${{ runner.temp }}/preview.md

  # fmt, clippy and the tests for each Rust app the change touches. On the
  # floating `rust = "1"` from mise.toml, where a compiler bump breaking is the
  # point; `binary` pins the toolchain that ships.
  rust:
    name: Rust (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.rust != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.rust) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install_args: rust

      # After mise, which is what puts this cargo on PATH. A pull request
      # restores main's cache but writes none of its own: a branch's cache is
      # invisible to every other branch and still evicts from the repository's
      # 10GB, which is how main ends up cold.
      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/${{ matrix.app }}
          shared-key: check-${{ matrix.app }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Check and Test
        working-directory: apps/${{ matrix.app }}
        run: cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --locked

  # Each Rust app in release, once per architecture, on a runner of that
  # architecture: musl is the host's own target rather than a cross, and
  # nothing is emulated. On the runner rather than in `docker build`, because
  # a cargo build in a Dockerfile is one atomic layer, so bumping a single
  # crate recompiles all of them; rust-cache restores cargo's own cache, which
  # is per crate. The image is these binaries copied into a base.
  binary:
    name: Build (${{ matrix.app }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.binaries != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.binaries) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          # Pinned, because this is what ships.
          toolchain: "1.97"
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/${{ matrix.app }}
          shared-key: ${{ matrix.app }}-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.app }}-${{ matrix.arch }}
          path: apps/${{ matrix.app }}/target/${{ matrix.target }}/release/${{ matrix.app }}
          if-no-files-found: error
          # Only has to reach `image`, in this run.
          retention-days: 1

  # Each container the change touches, for both architectures. A pull request
  # builds it to prove it builds. Main pushes it under `sha-<commit>`, in
  # parallel with the checks: nothing deploys a commit tag, and CD moves
  # `main`, `latest` and a release's version tags onto it only once `Checks`
  # has passed. The Rust images copy in what `binary` built, so their build
  # runs no code and needs no emulation; the files image's one RUN runs
  # emulated for arm64, and the registry cache keeps that layer.
  image:
    name: Image (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes, binary]
    if: ${{ !cancelled() && needs.changes.outputs.images != '[]' && (needs.binary.result == 'success' || needs.binary.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      IMAGE: ghcr.io/radiosilence/${{ matrix.image }}
      PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # The build context is `dist/`, one directory per architecture, which
      # the Dockerfile picks from with TARGETARCH.
      - name: Download amd64 binary
        if: matrix.rust
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.app }}-amd64
          path: dist/amd64

      - name: Download arm64 binary
        if: matrix.rust
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.app }}-arm64
          path: dist/arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.rust && 'dist' || format('apps/{0}', matrix.app) }}
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.version }}
          # The layer cache lives beside the image in GHCR rather than in the
          # repository's Actions cache, which the Rust caches need. Written
          # from main only; anything else reads it.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ env.PUSH == 'true' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}

  # The one status the ruleset requires. Skipped jobs are domains the change
  # does not touch and pass; anything failed or cancelled fails it.
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, lint, format, typecheck, test, preview, rust, binary, image]
    if: always()
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(" ")')
          if [ -n "$bad" ]; then
            echo "::error::not passed: $bad"
            exit 1
          fi

  # ── CD ──────────────────────────────────────────────────────────────────
  #
  # Main only, after `Checks`. `checks` runs whatever its needs did, so every
  # job here states the results it depends on rather than relying on the
  # default, which would skip it whenever any job upstream was skipped.

  # One `pulumi up` for everything. In a group of its own and never cancelled,
  # so a manual run's deploy and a push's never overlap and neither is
  # interrupted part-way.
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [changes, checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.changes.outputs.deploy == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install_args: node aube pulumi

      - name: Authenticate to GitHub Packages
        run: mise run auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      # Fails rather than skips without the token: a main that silently stops
      # deploying is worse than a red run.
      - name: Deploy
        working-directory: packages/infra
        run: pulumi up --yes --non-interactive --refresh -s "$STACK"
        env:
          STACK: radiosilence/jaritanet/main
          # The only value CI holds that the stack cannot, because it is what
          # reaches the stack in the first place.
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          # Drops Kubernetes resources from state when their cluster is gone.
          # An input rather than a default: left on, it would do the same to a
          # cluster that was only briefly unreachable.
          PULUMI_K8S_DELETE_UNREACHABLE: ${{ inputs.deleteUnreachable && 'true' || '' }}

  # Each image CI pushed, retagged: `main` and `latest` on every passing push,
  # and on a release its version, and for a stable one `<major>.<minor>` and
  # `<major>`. Retagging needs no rebuild, and repeats safely. `main` and
  # `latest` only move forward: to this commit when it descends from the one
  # `main` holds now (its revision label), since a manual run can finish
  # after a later push's.
  promote:
    name: Promote (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes, checks, image]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.image.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag
        env:
          IMAGE: ghcr.io/radiosilence/${{ matrix.image }}
          VERSION: ${{ matrix.version }}
          RELEASE: ${{ matrix.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags=()
          held=$(docker buildx imagetools inspect "$IMAGE:main" --format '{{json .Image}}' 2>/dev/null \
            | jq -r '[.. | objects | .config.Labels?["org.opencontainers.image.revision"]? // empty][0] // empty' || true)
          status=ahead
          if [ -n "$held" ] && [ "$held" != "$GITHUB_SHA" ]; then
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$held...$GITHUB_SHA" --jq .status)
          fi
          if [ "$status" = ahead ]; then
            tags+=(-t "$IMAGE:main" -t "$IMAGE:latest")
          else
            echo "::notice::main holds $held, which this commit does not descend from ($status); leaving main and latest"
          fi
          # A prerelease gets its exact version and nothing else: moving `2` or
          # `2.1` onto an rc is how people end up running one by accident.
          if [ "$RELEASE" = true ]; then
            tags+=(-t "$IMAGE:$VERSION")
            case "$VERSION" in
              *-*) ;;
              *)
                major=${VERSION%%.*}
                minor=${VERSION#"$major".}
                minor=${minor%%.*}
                tags+=(-t "$IMAGE:$major.$minor" -t "$IMAGE:$major")
                ;;
            esac
          fi
          if [ ${#tags[@]} -gt 0 ]; then
            docker buildx imagetools create "${tags[@]}" "$IMAGE:sha-${GITHUB_SHA::7}"
          fi

  # After the image's version tag, so a release never names an image that does
  # not exist: the updater reads these releases and moves the pin.
  release:
    name: Release (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes, promote]
    if: ${{ !cancelled() && needs.promote.result == 'success' && needs.changes.outputs.release == 'true' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.releases) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Notes are scoped with git log, which needs history and tags.
          fetch-depth: 0

      - name: Create the release, and its tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP: ${{ matrix.app }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          if gh release view "$APP-v$VERSION" >/dev/null 2>&1; then
            echo "$APP-v$VERSION is already released"
            exit 0
          fi
          # --generate-notes diffs against the previous tag in the repo, which
          # knows nothing about tag prefixes: the first release of a container
          # credits it with every PR ever, and later ones pick up whichever
          # container tagged last. Scope to this container's own history instead.
          prev=$(git tag --list "$APP-v*" --sort=-version:refname | head -1)
          range=${prev:+$prev..}HEAD
          notes=$(git log --no-merges --pretty='- %s' "$range" -- "apps/$APP")
          gh release create "$APP-v$VERSION" \
            --title "$APP v$VERSION" \
            --target "$GITHUB_SHA" \
            --notes "${notes:-- No changes recorded for this container.}"
