name: CI/CD

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      deleteUnreachable:
        description: >-
          Drop Kubernetes resources from state when their cluster is
          unreachable. For a cluster that has been replaced or retired — never
          for one that is merely down, since it deletes live resources from
          state.
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci-cd.yml
      - "packages/**"
      - "apps/**"
      - "*.config.*"
      - package.json
  pull_request:
    paths:
      - .github/workflows/ci-cd.yml
      - "packages/**"
      - "apps/**"
      - "*.config.*"
      - package.json
  workflow_call:
    secrets:
      PULUMI_ACCESS_TOKEN:
        required: true

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Install Dependencies
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      - name: Lint
        run: mise run lint

  format:
    name: Format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Install Dependencies
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      - name: Format Check
        run: mise run fmt:check

  typecheck:
    name: Type Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Install Dependencies
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      - name: Type Check
        run: mise run typecheck

  test:
    name: Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Install Dependencies
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      - name: Run Tests
        run: mise run test

      # The unit tests validate profile *shape* against sing-box's published
      # (latest) schema. This runs the real binary of the oldest core the fleet
      # is on, which is the only thing that answers "will the devices accept
      # this" — the question July's outage turned on.
      - name: Check profiles against the minimum sing-box core
        run: mise run check:profiles

  containers:
    name: Containers (${{ matrix.crate }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        crate: [apps/serve-from-env, apps/mariastew, apps/auth]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      # Same reason the container builds moved their compile onto the runner:
      # without this every leg recompiles ~200 crates from cold on every push.
      # After mise, which is what puts this cargo on PATH.
      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ${{ matrix.crate }}
          # A pull request restores main's cache but writes none of its own: a
          # branch's cache is invisible to every other branch and still evicts
          # from the repository's 10GB, which is how main ends up cold.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check and Test
        working-directory: ${{ matrix.crate }}
        run: cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --locked

  deploy:
    name: Deploy
    # Not `containers`: the deploy neither builds nor consumes the container
    # images — they are published by their own workflow and pinned by tag — so
    # gating on them would block infra deploys for an unrelated red.
    needs: [test, lint, format, typecheck]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      (github.ref == 'refs/heads/main' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Install Dependencies
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      # Stack configuration, external-IP detection and the update itself all
      # happen inside deploy.ts, so preview.yml runs the identical code path.
      - name: Deploy
        working-directory: packages/infra
        run: pulumi up --yes --non-interactive --refresh -s "$STACK"
        env:
          STACK: radiosilence/jaritanet/main
          # The only value CI holds that the stack cannot, because it is what
          # reaches the stack in the first place.
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          # Drops Kubernetes resources from state when their cluster is gone.
          # An input rather than a default: left on, it would do the same to a
          # cluster that was only briefly unreachable.
          PULUMI_K8S_DELETE_UNREACHABLE: ${{ inputs.deleteUnreachable && 'true' || '' }}
