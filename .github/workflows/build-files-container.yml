name: Build Files Container

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
    paths:
      - "apps/files/**"
      - ".github/workflows/build-files-container.yml"
  pull_request:
    paths:
      - "apps/files/**"
      - ".github/workflows/build-files-container.yml"
  workflow_dispatch:

jobs:
  # Same shape as serve-from-env, reading `VERSION` because an nginx config has
  # no manifest to hold the number. Still one source of truth per container:
  # copying the crate's version into a second file is how the two drift.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Read the version, and ask whether it has been released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < apps/files/VERSION)
          if [ -z "$version" ]; then
            echo "apps/files/VERSION is empty" >&2
            exit 1
          fi
          if gh release view "files-v$version" >/dev/null 2>&1; then
            release=false
          else
            release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version $version, release $release"

  publish:
    name: Build and Publish
    needs: [version]
    uses: radiosilence/blit-workflows/.github/workflows/build-publish-container.yml@dd9d9c97a8c1ee1e27f285a96cbb50b2b6c16e06 # native-arm-runners
    with:
      working-directory: "./apps/files"
      image: "jaritanet-files"
      version: ${{ needs.version.outputs.release == 'true' && needs.version.outputs.version || '' }}
    secrets:
      PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    needs: [version, publish]
    if: needs.version.outputs.release == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Notes are scoped with git log, which needs history and tags.
          fetch-depth: 0

      - name: Create the release, and its tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # --generate-notes diffs against the previous tag in the repo, which
          # knows nothing about tag prefixes: the first release of a container
          # credits it with every PR ever, and later ones pick up whichever
          # container tagged last. Scope to this container's own history instead.
          prev=$(git tag --list 'files-v*' --sort=-version:refname | head -1)
          range=${prev:+$prev..}HEAD
          notes=$(git log --no-merges --pretty='- %s' "$range" -- apps/files)
          gh release create "files-v$VERSION" \
            --title "files v$VERSION" \
            --target "$GITHUB_SHA" \
            --notes "${notes:-- No changes recorded for this container.}"
