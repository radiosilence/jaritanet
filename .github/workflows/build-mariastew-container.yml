name: Build Mariastew Container

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
    paths:
      - "apps/mariastew/**"
      - ".github/workflows/build-mariastew-container.yml"
  pull_request:
    paths:
      - "apps/mariastew/**"
      - ".github/workflows/build-mariastew-container.yml"
  workflow_dispatch:

jobs:
  # Tags are output, not input: the version in Cargo.toml is the source of truth,
  # and a release exists because that number changed. Nothing here reads a tag to
  # decide what to build, so there is no second place to keep in step by hand.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Read the version, and ask whether it has been released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/mariastew/Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "no version in apps/mariastew/Cargo.toml" >&2
            exit 1
          fi
          # Whether this exact release exists, rather than a comparison with the
          # newest one, so a revert or a re-run does not try to cut a version that
          # is already out.
          if gh release view "mariastew-v$version" >/dev/null 2>&1; then
            release=false
          else
            release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version $version, release $release"

  # Compiled here rather than inside `docker build`, because a cargo build in a
  # Dockerfile is one atomic layer: bumping a single crate recompiles all ~200
  # of them, 168s against the 15s our own code costs. rust-cache restores
  # cargo's own cache, which is per-crate, so only what actually moved is
  # rebuilt. Still one runner per architecture, natively, so nothing is
  # emulated and musl is the host's own target rather than a cross.
  binary:
    name: Compile ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          # Pinned, because this is what ships — the floating `rust = "1"` in
          # mise.toml covers clippy and the tests, where a compiler bump
          # breaking is the point. Dockerfile.dev keeps its own copy for the
          # dev image, which ships nowhere.
          toolchain: "1.97"
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/mariastew
          key: ${{ matrix.target }}
          # A pull request restores main's cache but writes none of its own: a
          # branch's cache is invisible to every other branch and still evicts
          # from the repository's 10GB, which is how main ends up cold.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        working-directory: apps/mariastew
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The publish job unpacks `<context-artifact>-<arch>` into the build
      # context of the leg with that architecture, so the suffix is the
      # contract rather than a label.
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mariastew-bin-${{ matrix.arch }}
          path: apps/mariastew/target/${{ matrix.target }}/release/mariastew
          if-no-files-found: error
          # Only has to survive the hop to the publish job.
          retention-days: 1

  publish:
    name: Build and Publish
    needs: [version, binary]
    # Builds each architecture on a native runner. `version` publishes the semver
    # tags, which metadata-action cannot derive here because the build runs on a
    # branch push with no tag to read.
    uses: radiosilence/blit-workflows/.github/workflows/build-publish-container.yml@644a5b0b8398f5e038a4639991fdddc623afe5eb # context-artifact
    with:
      working-directory: "./apps/mariastew"
      image: "mariastew"
      context-artifact: "mariastew-bin"
      version: ${{ needs.version.outputs.release == 'true' && needs.version.outputs.version || '' }}
    secrets:
      PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  # After publishing, so a release never names an image that does not exist. The
  # updater reads these releases and moves the pin in Pulumi.main.yaml.
  release:
    name: Release
    needs: [version, publish]
    if: needs.version.outputs.release == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Notes are scoped with git log, which needs history and tags.
          fetch-depth: 0

      - name: Create the release, and its tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # --generate-notes diffs against the previous tag in the repo, which
          # knows nothing about tag prefixes: the first release of a container
          # credits it with every PR ever, and later ones pick up whichever
          # container tagged last. Scope to this container's own history instead.
          prev=$(git tag --list 'mariastew-v*' --sort=-version:refname | head -1)
          range=${prev:+$prev..}HEAD
          notes=$(git log --no-merges --pretty='- %s' "$range" -- apps/mariastew)
          gh release create "mariastew-v$VERSION" \
            --title "mariastew v$VERSION" \
            --target "$GITHUB_SHA" \
            --notes "${notes:-- No changes recorded for this container.}"
