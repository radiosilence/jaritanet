name: CI jaritanet

permissions:
  contents: read
  # @radiosilence/mcp-gateway-pulumi comes from GitHub Packages.
  packages: read

on:
  workflow_dispatch:
    inputs:
      deleteUnreachable:
        description: >-
          Drop Kubernetes resources from state when their cluster is
          unreachable. For a cluster that has been replaced or retired — never
          for one that is merely down, since it deletes live resources from
          state.
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - "packages/**"
      # Apps hold their own build tooling (aube-workspace.yaml), so this is
      # where mariastew's own tsconfig/lint/fmt actually get checked.
      - "apps/**"
      - "*.config.*"
      - package.json
  workflow_call:
    secrets:
      PULUMI_ACCESS_TOKEN:
        required: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    # A push to main is always a merge, and the pull_request run already
    # checked this exact tree before it landed — rerunning here only repeats
    # that same result while blocking the deploy behind it.
    if: github.event_name != 'schedule' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      # `.npmrc` names a token file rather than an ${ENV}, because aube refuses
      # to expand environment variables in auth settings a project controls.
      - name: Authenticate to GitHub Packages
        run: mise run auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      - name: Lint
        run: mise run lint

  format:
    name: Format
    if: github.event_name != 'schedule' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      # `.npmrc` names a token file rather than an ${ENV}, because aube refuses
      # to expand environment variables in auth settings a project controls.
      - name: Authenticate to GitHub Packages
        run: mise run auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      - name: Format Check
        run: mise run fmt:check

  typecheck:
    name: Type Check
    if: github.event_name != 'schedule' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      # `.npmrc` names a token file rather than an ${ENV}, because aube refuses
      # to expand environment variables in auth settings a project controls.
      - name: Authenticate to GitHub Packages
        run: mise run auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      - name: Type Check
        run: mise run typecheck

  test:
    name: Test
    if: github.event_name != 'schedule' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Environment
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      # `.npmrc` names a token file rather than an ${ENV}, because aube refuses
      # to expand environment variables in auth settings a project controls.
      - name: Authenticate to GitHub Packages
        run: mise run auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
        with:
          node-version: auto
          run-install: true
          install-args: --frozen-lockfile

      - name: Run Tests
        run: mise run test

      # The unit tests validate profile *shape* against sing-box's published
      # (latest) schema. This runs the real binary of the oldest core the fleet
      # is on, which is the only thing that answers "will the devices accept
      # this" — the question July's outage turned on.
      - name: Check profiles against the minimum sing-box core
        run: mise run check:profiles
