# The credentials, and nothing else.
#
# This file used to describe the whole deployment. What jaritanet *is* now lives
# in `src/stack.ts`, where the compiler checks it and a value used twice is one
# binding; what is left here is the part that cannot be committed in the clear.
#
# What makes committing the ciphertext safe is the secrets provider, not the
# encryption on its own: this stack uses Pulumi Cloud's, so only the service
# holds the key. Running it under PULUMI_CONFIG_PASSPHRASE instead would write
# an `encryptionsalt` here and turn every blob — including all of git history,
# which cannot be un-published — into an offline cracking target against a
# single password. Don't.
#
# A secret decrypts to an ordinary string in the program, so one Zod parse in
# `src/secrets.ts` still validates the whole block.
#
# Hostnames used to be here too, encrypted so a public repository would not hand
# out the list. Every one of them carries a certificate and so was in the
# Certificate Transparency logs regardless; that only mattered while the logs
# were awkward to search, which crt.name ended. They are plain values in
# `src/stack.ts` now.
