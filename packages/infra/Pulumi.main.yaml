    botToken:
      secure: AAABAG1Dqy8QBBuB3QXADxbmJXDhzq7ZRvXoV4LlNZ8LuSXajDoE7AvgtWvJnhIEaXGRPOR46RFiItpup9yJXNsRTXRNS3EvFSEY6vJU
    chatId:
      secure: AAABANHyq2ApXfynG6m0hA1s2LGgzmsn027DsS6erT16+yUxGKwagBo=
  jaritanet:vpnUsers:
    secure: AAABACurdilg/HdFEY83oVFyPGyDRfbtDKWALsVqW/yTckjv6qBDJqEc
  # The login screen, at the hostname Hydra already stands at and split from it
