  # is what authenticates for them.
  jaritanet:auth:
    github:
      clientId: Ov23lig1BPAzKe4qmT4F
      clientSecret:
        secure: AAABABWd9lK1EzC9LTNd3OqfDX/PUpWiqVa93X0ewLzYDOOonK03zaoZd0hwsakNVSV389w9gxRtCz4MPyq/quOWLObM3sIn
