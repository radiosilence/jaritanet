# yaml-language-server: $schema=../../schemas/infra.json
#
# Everything the deploy needs, credentials included — nothing is injected from
# the environment. Secrets nest beside whatever consumes them, because a secret
# inside structured config decrypts to an ordinary string in the program, so one
# Zod parse still validates the whole block.
#
# What makes committing the ciphertext safe is the secrets provider, not the
# encryption on its own: this stack uses Pulumi Cloud's, so only the service
# holds the key. Running it under PULUMI_CONFIG_PASSPHRASE instead would write
# an `encryptionsalt` here and turn every blob — including all of git history,
# which cannot be un-published — into an offline cracking target against a
# single password. Don't.
#
# The service hostnames are encrypted, which is not the same claim as private:
# every one of them carries a certificate, so it is already in the public
# Certificate Transparency logs and can be found by anyone who goes looking.
# What this buys is that a public repository does not hand out the list — the
# drive-by case, not the determined one. blit.cc stays in the clear because it
# is the apex and fronts a public site, so there is nothing to withhold.
#
# Encrypting them here is only worth anything while the rest of the repository
# agrees: a hostname repeated in a doc or a comment undoes it silently.
config:
  jaritanet:cloudflare:
    accountId: 365e5168438376dc99d7ee2aedef4624
    apiToken:
      secure: AAABAJX8cafbz/aUgmLbmT8KblMp3cbVu78cRvOC7JmXtIXI/WMVheCHJvsojIG+k22JfcCFaty4nNxeqRqF5C+dWg0GTAHQarqZhWlgF5toq3RGeA==
  jaritanet:traefik:
    acmeEmail: jc@blit.cc
    chartVersion: "41.2.0"
  jaritanet:gateway:
    # sympathy — Ampere ARM. Every image we run publishes arm64, and CAX is both
    # cheaper and actually in stock, unlike the CX line. 8GB because this box now
    # carries the cluster as well as the transports.
    name: sympathy
    # cx33: 4 vCPU / 8GB, x86 like the box already running, so this is an
    # in-place resize rather than a new machine — the IP and the on-box REALITY
    # key survive, and no client profile has to change. CAX (ARM) was the plan
    # until it turned out to be unavailable in every location.
    location: nbg1
    serverType: cx33
    # The cluster lives here now. One `pulumi up` creates the box, installs k3s,
    # reads its kubeconfig and deploys into it.
    # Cilium's version must match the k8s minor, and parsing enforces it against
    # CILIUM_K8S_SUPPORT — take a new row from Cilium's own requirements doc for
    # that branch rather than from memory. Outside the tested range you are
    # relying on Kubernetes' backward compatibility rather than on anything
    # tested, and the failure is a cluster that comes up healthy and moves no
    # packets. Both values reach the fleet from here: version via an upgrade
    # Plan, ciliumVersion via Helm.
    k3s:
      version: v1.36.3+k3s1
      ciliumVersion: 1.20.0
      upgradeControllerVersion: v0.20.1
    # xray shares :443; traffic that doesn't match a client falls back to
    # dest (Traefik's local https port), so real visitors still get the site.
    #
    # These are DELIBERATELY not our own domains. Content-filtering middleboxes
    # (FortiGate et al) decide what to TLS-intercept from the SNI's reputation
    # category, and a sparse personal domain is one bad rating away from having
    # every REALITY handshake forged out from under it — blit.cc is rated "Other
    # Adult Materials" by FortiGuard, which killed the tunnel on every filtered
    # guest network. A category no filter dares touch is worth more here than an
    # SNI that matches dest's cert; see docs/architecture.md.
    #
    # A list because no one borrowed identity is safe everywhere: google is
    # camouflage in a British pub and blocked outright in China, where bing and
    # apple still pass. First entry is the client's default; the rest are extra
    # outbounds in its urltest, so it finds the identity the local network
    # tolerates without anyone touching a setting.
    xray:
      serverNames:
        - www.google.co.uk
        - www.microsoft.com
        - www.apple.com
        - www.bing.com
        - www.baidu.com
        - vk.com
      dest: 127.0.0.1:8443
      version: v26.3.27
    # Hysteria2 (QUIC/UDP) on 443/udp — fast, loss-tolerant daily driver.
    # The image is a maintainer's Docker Hub account rather than the project's
    # own org, which publishes none — see conf.schemas.ts.
    hysteria:
      image: docker.io/tobyxdd/hysteria:v2.12.1
    # Tailnet relay: joins the VPS to the tailnet so clients can reach 100.x
    # over the tunnel. Provisioned only when TS_AUTHKEY is set, so this is a
    # no-op until the secret exists.
    tailnet:
      hostname: sympathy
      image: ghcr.io/tailscale/tailscale:v1.102.2
    # Caching resolver for VPN clients, reached at 127.0.0.1:53 through the
    # tunnel. Distinct from coredns, which serves pods.
    unbound:
      image: docker.io/klutchell/unbound:v1.26.0
    hcloudToken:
      secure: AAABAOgRAPNoCi9RMimIgP3fLzyirP3UdoMx34L1D5tApjmkfrEF60Ys9++KOGJz+0jKxMI5PgGC1LXqk1AiRgZS3psE7g/YHhKkWxMGiCoHVW83ro5MjAtbrAhSyl8+
  # Egress exit nodes — ss-rust on the machine whose IP you want to leave from,
  # selectable in the client as exit-<name>. lady is the only one worth having:
  # her address is a consumer ISP's, which no Hetzner range can be.
  #
  # `server` is her tailnet address — how an entry reaches a box behind NAT with
  # no forwarded port. Pinned rather than stable: a re-registration moves it and
  # the exit then dials nobody, with everything still reporting healthy, so it
  # is re-read from `kubectl get node lady -o wide` when that happens.
  #
  # `node` is the machine this program marks with `nodeLabel`, over the API
  # rather than SSH. Marking it is the whole deployment: the DaemonSet controller
  # watches Nodes, so the exit appears there within a second and vanishes if the
  # label goes. Hand-labelling still works and is how you move an exit for an
  # afternoon — it is no longer what holds it in place.
  #
  # The port is derived from the name; only set `port` to break a hash clash.
  jaritanet:exits:
    - name: lady
      node: lady
      nodeLabel: jaritanet.radiosilence.dev/vpn-exit
      server: 100.74.66.121
  jaritanet:services:
    navidrome:
      kind: web
      hostname:
        secure: AAABAOdacdl4CcEW/0b8Wssi5aAAtgT36tDzLCGgrCDnUsySnEuGoId0I0g4
      args:
        httpPort: 4533
        # Public-facing, on the host that holds the media: confine egress to
        # DNS and the public internet, so a bug in it cannot walk to whatever
        # the node is serving and write the library by another route.
        networkPolicy: true
        # Run as the uid that already owns /data (1001:1002, 0755 on the host),
        # rather than as root borrowing CAP_DAC_OVERRIDE to write a directory it
        # does not own. That is what makes dropping capabilities safe here: the
        # DB is writable by ownership, 4533 needs no NET_BIND_SERVICE, and
        # /music (1000:1000, 0775) stays readable through its other bits.
        #
        # fsGroup is deliberately absent — see SecurityContextSchema. Setting it
        # would hand kubelet ownership management over a 2Ti local PV.
        securityContext:
          runAsUser: 1001
          runAsGroup: 1002
        dropCapabilities: true
        strategy:
          type: Recreate
        image:
          repository: "deluan/navidrome"
          tag: 0.63.2
        env:
          ND_SCANSCHEDULE: 1h
          ND_LOGLEVEL: info
          ND_SESSIONTIMEOUT: 24h
          ND_ENABLESHARING: "true"
          ND_ENABLETRANSCODINGCONFIG: "true"
          ND_TRANSCODINGCACHESIZE: 5Gi
          ND_ENABLEGRAVATAR: "true"
          ND_SCANNER_PURGEMISSING: "always"
          ND_UIWELCOMEMESSAGE: "fuck off"
        healthCheck:
          path: "/ping"
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        limits:
          cpu: 2000m
          memory: 4Gi
        persistence:
          - name: music
            storage: 2Ti
            hostPath: /mnt/kontent/music
            mountPath: /music
            readOnly: true
            nodeAffinityHostname: lady
          - name: data
            storage: 20Gi
            hostPath: /home/navidrome/data
            mountPath: /data
            readOnly: false
            nodeAffinityHostname: lady
    files:
      kind: web
      hostname:
        secure: AAABAHFob6VSSPAryzCz1JmtWNQ9d4CnjpAHx14AgwDb75eRTy4FPmcrmYOXagsN1+RQNzPF
      args:
        # Serves a read-only mount to the internet and nothing else — it has no
        # business reaching the node, the LAN or another pod. No capability
        # dropping: nginx binds :80 inside the container, which needs
        # NET_BIND_SERVICE even as root once ALL is dropped.
        networkPolicy: true
        # The guinea pig for ingress restriction (#172): static nginx over a
        # read-only mount, so if Calico drops the kubelet's probes and the pod
        # restart-loops, nobody notices. Extend to blit/navidrome only once this
        # has stayed Ready through several probe cycles.
        restrictIngress: true
        strategy:
          type: Recreate
        image:
          repository: "ghcr.io/radiosilence/jaritanet-files"
          tag: 1.0.0
        replicas: 1
        healthCheck:
          path: "/"
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 5
        limits:
          cpu: 100m
          memory: 64Mi
        persistence:
          - name: files
            storage: 20Mi
            hostPath: /srv/files
            mountPath: /srv/files
            readOnly: true
            nodeAffinityHostname: lady
    blit:
      kind: web
      hostname: blit.cc
      args:
        # Public-facing, so confine egress to DNS and the internet. No
        # capability dropping: the image is distroless, so what it needs at
        # runtime cannot be checked from here, and guessing that is what took
        # Navidrome down (see #166/#168).
        networkPolicy: true
        # One node means one failure domain: a second replica dies with the
        # first, so it bought nothing. maxSurge still brings the new pod up
        # before the old one goes, so deploys stay seamless.
        replicas: 1
        healthCheck: {}
        # Measured: 1m CPU and 68Mi per replica for a static site. The old
        # 1000m/1024Mi was a ceiling nobody had looked at, and since a limit
        # without a request becomes the request, two replicas reserved half
        # the node and the scheduler refused a VPN transport for lack of CPU.
        # CPU is 5x that: nano-web processes every file before it binds, which
        # under 100m outlasted the liveness probe. Requests are a tenth of the
        # limit, so the burst is borrowed rather than held.
        limits:
          cpu: 500m
          memory: 192Mi
        image:
          repository: "ghcr.io/radiosilence/blit"
          tag: sha-e7ec682
        httpPort: 3000
    # What lady serves off the media drive. Shares are anonymous — `map to
    # guest` turns unknown users into `guestAccount`, which must own the files
    # or every read fails — and reachable only from the tailnet and the LAN,
    # never the internet. jc owns /mnt/kontent, and is uid/gid 1000 on the node.
    #
    # Paths are under the mount, so an unmounted drive means the hostPath type
    # `Directory` finds nothing and the pod stays Pending rather than serving an
    # empty share.
    #
    # `nodeLabel` is left at its default: which machine holds the disks is a
    # property of that machine, applied by the seed drive when it joins.
    samba:
      kind: samba
      guestAccount: jc
      shares:
        - name: music
          hostPath: /mnt/kontent/music
        - name: movies
          hostPath: /mnt/kontent/movies
        - name: tv
          hostPath: /mnt/kontent/tv
        - name: dl
          hostPath: /mnt/kontent/dl
    # Which folders syncthing can reach; what is actually synced with whom is
    # set in its own UI, which is state it keeps for itself. No hostname, so the
    # UI stays on :8384 over the LAN and the tailnet rather than being published.
    #
    # It runs as the media's owner rather than relying on fsGroup, which kubelet
    # does not apply to hostPath volumes — so what it writes stays readable by
    # samba and navidrome.
    syncthing:
      kind: syncthing
      folders:
        - name: music
          hostPath: /mnt/kontent/music
    mcp-gateway:
      kind: mcp-gateway
      # GitHub OAuth credentials and the login allowlist come from stack config.
      hostname:
        secure: AAABADHN+GrfSd0qTwQAuaJp3u9RRiCJf/3Ki4LWnL2HYjO6XupTDBd6qw==
      hydraTag: "v2.2.0"
      replicas: 2
      # Routes and terminates OAuth rather than serving a file, so it gets more
      # headroom than blit — but it measured 1m CPU idle, not 500m.
      limits:
        cpu: "250m"
        memory: "256Mi"
      image:
        # Bumped by update-apps.yml, which watches mcp-gateway's releases. It used
        # to be a sha pushed here by that repo's CI on every build.
        repository: "ghcr.io/radiosilence/mcp-gateway"
        tag: v0.7.0
      # Each entry is both a backend pod and its entry in the registry the gateway
      # boots from (MCP_REGISTRY) — declared once, since a registry naming a pod
      # that doesn't exist is just a 502. The in-cluster URL joining them is
      # derived, so nothing here says where an MCP lives.
      mcps:
        # Pinned to release tags, not :main. A floating tag with the default
        # pull policy leaves a running pod on whatever it first pulled, so the
        # backends would silently drift from the gateway they serve.
        - id: fastmail
          name: Fastmail
          image: "ghcr.io/radiosilence/fastmail-cli:v3.3.2"
          args: ["mcp", "--http", "0.0.0.0:8080", "--graphql"]
          port: 8080
          path: "/mcp"
          graphqlPath: "/graphql"
          keyHelpUrl: "https://app.fastmail.com/settings/security/tokens"
          # Mail runs on the API token; contacts go over CardDAV, which is a
          # separate protocol that rejects API tokens — hence three values
          # rather than one. The CardDAV pair is optional: without it mail works
          # and contact search doesn't, which the backend reports up front as
          # `session { carddavConfigured }` rather than failing a query halfway
          # through one. `token` keeps the id the credentialHeader shorthand
          # normalised to, so stored credentials survive the change.
          fields:
            - id: token
              label: API token
              header: "X-Fastmail-Token"
              hint: "fmu1-…"
            - id: username
              label: Username (contacts only)
              header: "X-Fastmail-Username"
              secret: false
              required: false
              hint: "you@fastmail.com"
            # An app password, not the API token above: CardDAV won't take one.
            - id: app_password
              label: App password (contacts only)
              header: "X-Fastmail-App-Password"
              required: false
              hint: "Blank = mail works, contact search doesn't"
          # Re-runs the handshake rather than reading a cached client, so a
          # revoked token is caught rather than reported as fine. Only a 401 is a
          # verdict on the credential; rate limits and outages are UNREACHABLE.
          verify:
            query: "{ session { status } }"
            path: session.status
            ok: CONNECTED
            rejected: INVALID_CREDENTIALS
        # CalDAV needs three values rather than one token, and serves plain
        # GraphQL beside /mcp so the dashboard can list an account's calendars
        # in one request instead of an MCP session handshake.
        - id: caldav
          name: Calendar (CalDAV)
          image: "ghcr.io/radiosilence/caldav-cli:v0.6.3"
          args: ["mcp", "--http", "0.0.0.0:8080", "--graphql"]
          port: 8080
          path: "/mcp"
          graphqlPath: "/graphql"
          keyHelpUrl: "https://appleid.apple.com"
          # A cheap PROPFIND for the principal — never touches the calendar list.
          verify:
            query: "{ viewer { status } }"
            path: viewer.status
            ok: CONNECTED
            rejected: INVALID_CREDENTIALS
          fields:
            - id: username
              label: "Apple ID / username"
              header: "X-CalDAV-Username"
              secret: false
              hint: "you@icloud.com"
            - id: password
              label: "App-specific password"
              header: "X-CalDAV-Password"
              secret: true
              hint: "abcd-efgh-ijkl-mnop"
            - id: url
              label: "CalDAV server"
              header: "X-CalDAV-Url"
              secret: false
              default: "https://caldav.icloud.com"
              required: false
            - id: calendar
              label: "Default calendar for new events"
              header: "X-CalDAV-Calendar"
              secret: false
              required: false
              hint: "Blank = whichever calendar your calendar app uses"
              # Keyed by id, not display name: two calendars can share a name
              # (this account has two "Family"), so a name is ambiguous — and the
              # value is what rides X-CalDAV-Calendar into every write.
              # supportsEvents marks the task-only collections nothing can land in.
              optionsQuery: "{ options: calendars(first: 100) { nodes { value: id label: name disabled: readOnly isDefault supportsEvents } } }"
              syncMutation: "mutation($value: String!) { setDefaultCalendar(id: $value) { success error } }"
        # The English folk archive. The first backend needing no credentials at
        # all: mainlynorfolk.info is a public website, so there is nothing to
        # authenticate to and nothing to store. `public: true` says so
        # explicitly — an omitted credential block is a schema error, not a
        # licence to front an MCP unauthenticated.
        - id: folk
          name: Folk (Mainly Norfolk)
          image: "ghcr.io/radiosilence/mainlynorfolk-mcp:v1.1.3"
          args: ["--http", "0.0.0.0:8080", "--graphql"]
          port: 8080
          path: "/mcp"
          graphqlPath: "/graphql"
          public: true
        # TfL needs no key at all — anonymous callers get 50 requests/minute,
        # which is the same data, not a degraded tier. A key raises that to 500,
        # so the field is offered and optional: the proxy treats a missing
        # credential as fine and the backend simply runs anonymously, which means
        # this works the moment someone logs in.
        - id: tfl
          name: TfL (London transport)
          image: "ghcr.io/radiosilence/tfl-mcp:v1.3.4"
          args: ["--http", "0.0.0.0:8080", "--graphql"]
          port: 8080
          path: "/mcp"
          graphqlPath: "/graphql"
          keyHelpUrl: "https://api-portal.tfl.gov.uk/profile"
          fields:
            - id: app_key
              label: "TfL app key (optional — raises the rate limit)"
              header: "X-Tfl-App-Key"
              secret: true
              required: false
              hint: "32 hex characters"
    singbox-profiles:
      kind: singbox-profiles
      hostname:
        secure: AAABAD4z8yRK5YnDrYTWNebcjtt0TQU8tTs+0AhHNx2NQGoAQ/8G19VGYiUeSGTTVig=
      image: ghcr.io/radiosilence/serve-from-env:0.1.0
    # Television and film only, which is what makes the scene-garbage filter
    # global — there is no album art to protect, so one list serves every
    # download. Each root is both the pod's mount and a root the picker
    # browses, declared once.
    #
    # The hostname is set as encrypted config out of band, the same reasoning
    # the other service hostnames carry: certificate transparency publishes
    # them anyway, but a public repository should not hand out the address of a
    # write endpoint onto the media library. An empty hostname means the
    # service is not deployed. Where it sends people to sign in is derived from
    # `auth.hostname` rather than configured here.
    mariastew:
      kind: mariastew
      hostname:
        secure: AAABALH0zY11nQLr6MZkyhv8bm35+Wpvwnxeq3YQBVjpRN6zuFzwHtrA
      image:
        repository: "ghcr.io/radiosilence/mariastew"
        tag: 0.1.28
      roots:
        - name: tv
          hostPath: /mnt/kontent/tv
        - name: movies
          hostPath: /mnt/kontent/movies
    # There was no history of anything: k3s ships metrics-server, so `kubectl
    # top` answers with fifteen seconds of instantaneous CPU, no retention and
    # no disk IO at all. #166/#168 were diagnosed by guessing at resource
    # ceilings nobody had measured.
    #
    # The store and Grafana's own state are directories on the gateway, so both
    # pin there — the home box is exactly where the dashboard must not live,
    # since its uplink dropping is when the graphs are most wanted.
    metrics:
      kind: metrics
      hostname:
        secure: AAABAPrG5CFazA6hrLjmaKcEWD5ye0zMJwhhWlQdHb5ZYE60sU/xNXzJzyA=
      storageNode: sympathy
      vmsingle:
        image: docker.io/victoriametrics/victoria-metrics:v1.150.0
        # Order of 10k series across both nodes with cAdvisor included, at a 30s
        # scrape, is single-digit GB a year on VictoriaMetrics' compression.
        retention: 1y
      vmagent:
        image: docker.io/victoriametrics/vmagent:v1.150.0
      nodeExporter:
        image: quay.io/prometheus/node-exporter:v1.12.1
      grafana:
        image: docker.io/grafana/grafana:13.1.3
  jaritanet:zones:
    - name: "blit.cc"
      zoneId: "8aa9988e3df6b6a6ab4e4e6dbc3a2451"
      modules:
        - fastmail
        - bluesky
    - name: radiosilence.dev
      zoneId: 3373ad7c3dc3104e7aeab31c1176e684
      modules:
        - fastmail
        - bluesky
    - name: buttholes.live
      zoneId: 1115a1e5006523692d61e49e672f6df0
      modules:
        - fastmail
        - bluesky
  jaritanet:fastmail:
    mxDomain: smtp.messagingengine.com
    dkimDomain: dkim.fmhosted.com
    dkimSubdomain: _domainkey
    dmarcSubdomain: _dmarc
    dmarcAggEmail: dmarc-agg@blit.cc
    dmarcPolicy: reject
    spfDomain: spf.messagingengine.com
  jaritanet:bluesky:
    did: did:plc:d32vuqlfqjttwbckkxgxgbgl
  cloudflare:apiToken:
    secure: AAABAAyTRwr6D9teTdgbWk2MOdcUtBUT/zaZgs+cbWPCz/IM9cFaXfhfhiHZi7RsdeujvCnJ46u9elLdSxd7pbYBfN+K1rReI1xJqHFP2cXRO4+pMA==
  hcloud:token:
    secure: AAABALtD7dj7hUYrd1dLznzw5u+hjfJj5fCpMv7fRmoXKOKxtlczVbxdWKzmDhHWJHHfQkj6Z8qoxgZqIatPwDZAvi+CDQS+OqDUhBLRSXl815dDWd8jB+/p6cHE2YTK
  jaritanet:ubuntuProToken:
    secure: AAABAH2gQiEnQhHzpwyAv7u//nuy08yl3yc+yd3rsTHew4jidd45Xp9MzYSUOWcSrw9d3PljUTjmnl/Aw6w=
  jaritanet:vpnEntryLabel: jaritanet.radiosilence.dev/vpn-entry
  jaritanet:adminSshKey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIOKFd98fp579BSC4svd/E8h1Bs5aeu9Iv5qix40+WmI jc@blit.cc
  jaritanet:tailnet:
    authKey:
      secure: AAABAPUJk8cSP4BCle0UNlTgQPHpZp80WGEMqbZp+4fx3Wh1ORkqWChwDukbz5Gd3DIsbT2L+F4awkbtp+R9xg6Elg1Ko8qHXYRVTM+My+YOv+Eus99hVHbE7usnjav7
    magicdnsSuffix: zonkey-jazz.ts.net
    oauth:
      clientId: kwGpaNTK9Y11CNTRL
      clientSecret:
        secure: AAABAGhrgFsFYiXNK3QDi18u9DbNtR/bd39xzOW+IkgvlQZHDoGnpD8325akS306yfV4DsZKTVoUnRCIEhTJfgaDM0KSuzgFABAKTxC5MpHPA6t6c2wzSkjhKI3YWfg=
    name: zonkey-jazz.ts.net
    tagOwners:
      - jc@blit.cc
    extraTags:
      - tag:ci
  # Shared account: the sing-box profile server notifies on change, mariastew
  # notifies when a download finishes. Absent → neither sends anything, which
  # both treat as normal rather than as an error.
  jaritanet:telegram:
    botToken:
      secure: AAABAG1Dqy8QBBuB3QXADxbmJXDhzq7ZRvXoV4LlNZ8LuSXajDoE7AvgtWvJnhIEaXGRPOR46RFiItpup9yJXNsRTXRNS3EvFSEY6vJU
    chatId:
      secure: AAABANHyq2ApXfynG6m0hA1s2LGgzmsn027DsS6erT16+yUxGKwagBo=
  jaritanet:vpnUsers:
    secure: AAABACurdilg/HdFEY83oVFyPGyDRfbtDKWALsVqW/yTckjv6qBDJqEc
  # The login screen, at the hostname Hydra already stands at and split from it
  # by path. Top level beside traefik, and for the same reason: traefik cannot
  # be a service because it is what publishes them, and this cannot because it
  # is what authenticates for them.
  jaritanet:auth:
