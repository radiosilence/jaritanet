# aube workspace config — security-focused defaults.
# Docs: https://aube.en.dev/security.html

# Minutes between a package being published and aube being willing to install
# it. 7 days (10080 min) buys us a window for the registry / community to
# catch and yank malicious releases before they reach our lockfile.
# Default is 1440 (1 day).
minimumReleaseAge: 10080

# Refuse to install a version whose trust evidence is weaker than an earlier
# release (eg. lost provenance, dropped signature). Mitigates downgrade
# attacks where an attacker republishes a "patched" version with weaker
# verifiability.
trustPolicy: no-downgrade

# Reject git/file/tarball transitive deps — only registry packages allowed
# below the top level. Default is true; pinned here so it stays that way.
blockExoticSubdeps: true

# Lifecycle scripts that may run during install. Moved from
# package.json#trustedDependencies (bun) — aube's equivalent.
allowBuilds:
  "@pulumi/command": true
  "@pulumi/kubernetes": true
  lefthook: true
  protobufjs: true

enableGlobalVirtualStore: false

jailBuilds: true

# Workspace members. aube is pnpm-style and takes these from here; the
# `workspaces` field in package.json is the npm/yarn convention and is ignored.
packages:
  - "packages/*"
  # Maintenance scripts. A workspace member so their imports resolve and they
  # are typechecked — which they were not, and check-profiles had been
  # validating an exit shape no device is ever handed.
  - "scripts"
  # Apps hold their own build tooling rather than being deployed from here.
  - "apps/*"
  # An app's chart lives with the app. They are one project — the chart pins the
  # app's own version — and when an app leaves for its own repository the chart
  # is part of the directory that goes with it, as mcp-gateway's and mariastew's
  # both were.
  - "apps/*/deploy/pulumi"
