pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: mise run lint:fix {staged_files}
      stage_fixed: true
    format:
      run: mise run fmt {staged_files} --no-error-on-unmatched-pattern
      stage_fixed: true
    typecheck:
      run: mise run typecheck
    rust:
      glob: "apps/**/*.rs"
      run: cd apps/serve-from-env && cargo fmt && cargo clippy --all-targets -- -D warnings
      stage_fixed: true
