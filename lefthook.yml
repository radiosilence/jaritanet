pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: mise run lint:fix {staged_files}
      stage_fixed: true
    format:
      run: mise run fmt {staged_files} --no-error-on-unmatched-pattern
      stage_fixed: true
    typecheck:
      run: mise run typecheck
    # Every crate a staged file belongs to, derived from the paths rather than
    # named. This was a hardcoded `cd apps/serve-from-env`, so the two crates
    # added after it were never formatted or linted before a commit — which is
    # how a `cargo fmt --check` failure got as far as CI, in a repo whose hook
    # had been running `cargo fmt` all along.
    rust:
      glob: "apps/**/*.rs"
      run: |
        for crate in $(printf '%s\n' {staged_files} | cut -d/ -f1-2 | sort -u); do
          (cd "$crate" && cargo fmt && cargo clippy --all-targets -- -D warnings) || exit 1
        done
      stage_fixed: true
