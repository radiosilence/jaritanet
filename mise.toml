[tools]
aube = "1"
node = "24"
pulumi = "latest"
# rustfmt and clippy are not in the minimal profile mise installs by default,
# and the containers job needs both.
rust = { version = "1", components = "rustfmt,clippy" }

[env]
# oxlint, oxfmt, tsc and vitest are workspace binaries. On PATH, a task can name
# the tool it runs instead of forwarding through the package manager to a
# package.json script that only forwards again.
_.path = ["node_modules/.bin"]

[tasks.setup]
description = "Toolchain, dependencies and git hooks, from a fresh clone"
# `prepare` installs lefthook, so the hooks come with the dependencies.
run = "aube install"

[tasks.lint]
description = "Lint with oxlint"
run = "oxlint"

[tasks."lint:fix"]
description = "Lint and auto-fix"
run = "oxlint --fix"

[tasks.fmt]
description = "Format with oxfmt"
run = "oxfmt --write"

[tasks."fmt:check"]
description = "Check formatting"
run = "oxfmt --check"

[tasks.typecheck]
description = "Type check every package"
run = 'for p in packages/*/tsconfig.json; do echo "→ $p" && tsc -p "$p" || exit 1; done'

[tasks.test]
description = "Run the test suite (vitest on Node — Pulumi needs Node's v8)"
run = "vitest run"

[tasks.check]
description = "Everything CI checks"
# No `run` of its own. These four are independent, so mise fans them out across
# its job pool instead of running a list in an order nothing requires — and a
# failure stops the dependents rather than the whole file.
depends = ["lint", "fmt:check", "typecheck", "test"]

[tasks."gen:schemas"]
description = "Generate JSON schemas from the Zod definitions"
# Sequential: the generator writes, then the formatter fixes what it wrote.
run = ["./scripts/gen-schemas.ts", "oxfmt --write schemas"]

[tasks."css"]
description = "Rebuild mariastew's stylesheet after changing a template"
dir = "apps/mariastew"
# The root's node_modules/.bin is what `_.path` puts on PATH; this binary
# comes from the app's own, so it is named by path rather than found.
run = "./node_modules/.bin/tailwindcss -i styles/app.css -o assets/app.css --minify"
# The output is committed, so cargo build needs no node toolchain and the
# container build has one artefact rather than two.

[tasks."check:profiles"]
description = "Validate every profile shape against the real sing-box binary (needs docker)"
run = "./scripts/check-profiles.ts"

# docker-compose's own `seed` service seeds these roots on every `up` — these
# two are for outside docker: the plain `cargo run` flow in "Local
# development", or resetting the fixtures without a full compose cycle.
[tasks."mariastew:seed"]
description = "Populate the local tv/movies roots with names shaped like the real library"
dir = "apps/mariastew"
run = "./scripts/seed-dev-fixtures.ts"

[tasks."mariastew:seed:reset"]
description = "Wipe the local tv/movies roots and reseed from scratch"
dir = "apps/mariastew"
run = "./scripts/seed-dev-fixtures.ts --reset"

[tasks."mariastew:dev"]
description = "Run mariastew + aria2 locally against a debug build (needs docker)"
dir = "apps/mariastew"
run = "docker compose up --build"

[tasks."update:apps"]
description = "Report or apply upstream version bumps"
run = "./packages/infra/src/update-apps.ts"

# Config lives in the stack, credentials included, so these need a Pulumi login
# and nothing else. They wrap the CLI directly — what once made a shared
# entrypoint worth having was config assembly, and there is none left to share.
[tasks.preview]
description = "Preview the stack"
dir = "packages/infra"
run = "pulumi preview"

[tasks.up]
description = "deprecated: use deploy"
run = "echo '[301] moved -> mise deploy (mise shadows `up`)'"

[tasks.deploy]
description = "Deploy the stack"
dir = "packages/infra"
run = "pulumi up"
