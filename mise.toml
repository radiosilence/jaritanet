[tools]
actionlint = "1.7.12"
# Exact, and passed to every aube-action step as well: aube versions differ
# in how the lockfile writes workspace members, so a local install and CI on
# different versions rewrite each other's lockfile.
aube = "2.11.0"
node = "24"
pulumi = "latest"
shellcheck = "0.11.0"
# rustfmt and clippy are not in the minimal profile mise installs by default,
# and the container workflows' check jobs need both.
rust = { version = "stable", components = "rustfmt,clippy" }
# Formats auth's askama templates (`mise run fmt:templates`) and checks them in CI,
# as the editor does. Our own tool, so mise's wait before installing a new release
# is off: CI runs the release the editor runs.
"github:radiosilence/askama-analyzer" = { version = "latest", minimum_release_age = "0" }
# Compiles auth's stylesheet (`mise run css`). Exact, because CI checks the
# committed stylesheet against a rebuild.
"github:tailwindlabs/tailwindcss" = "4.3.5"

[env]
# oxlint, oxfmt, tsc and vitest are workspace binaries. On PATH, a task can name
# the tool it runs instead of forwarding through the package manager to a
# package.json script that only forwards again.
_.path = ["node_modules/.bin"]

[tasks.auth]
description = "Write the GitHub Packages token .npmrc reads"
# Not an ${ENV} in .npmrc: aube refuses to expand environment variables in auth
# settings a project controls, because a checked-in .npmrc could otherwise
# exfiltrate the environment of anyone who installs. So the token goes in a
# gitignored file that .npmrc names. GH_TOKEN for CI, the gh login otherwise —
# either way nobody has to mint a PAT by hand.
run = '''
token="${GH_TOKEN:-$(gh auth token 2>/dev/null || true)}"
if [ -z "$token" ]; then
  echo "no GitHub token: run 'gh auth login', or set GH_TOKEN" >&2
  exit 1
fi
printf '//npm.pkg.github.com/:_authToken=%s\n' "$token" > .npmrc.auth
'''

[tasks.setup]
description = "Toolchain, dependencies and git hooks, from a fresh clone"
# `prepare` installs lefthook, so the hooks come with the dependencies. It
# no-ops under `CI`: a runner has no commits to lint, and a half-written
# `.git/hooks/pre-commit` is what broke the workflows that do commit.
run = "aube install"

[tasks.css]
description = "Check auth's markup against the kit and rebuild apps/auth/assets/app.css after changing apps/auth/styles or a template"
# The output is committed: the binary embeds it, and building auth must not
# need the Tailwind CLI. The kit's stylesheet is compiled from the source of the
# koan-kit-web crate that Cargo.lock names, through the gitignored link
# `styles/kit`, so the markup the components write and the rules that draw it
# come from one release. kit-check fails first on any class outside the kit's
# look, which would otherwise compile to nothing and lose its style silently.
dir = "apps/auth"
run = """
set -eu
manifest=$(cargo metadata --format-version 1 --locked | python3 -c 'import json, sys; print(next(p["manifest_path"] for p in json.load(sys.stdin)["packages"] if p["name"] == "koan-kit-web"))')
ln -sfn "$(dirname "$manifest")" styles/kit
node styles/kit/kit-check.mjs templates src
tailwindcss --input styles/app.css --output assets/app.css --minify
"""

[tasks.lint]
description = "Lint with oxlint"
run = "oxlint"

[tasks."lint:workflows"]
description = "Lint the GitHub Actions workflows with actionlint (and shellcheck for their scripts)"
run = "actionlint"

[tasks."lint:fix"]
description = "Lint and auto-fix"
run = "oxlint --fix"

[tasks.fmt]
description = "Format with oxfmt"
run = "oxfmt --write"

[tasks."fmt:templates"]
description = "Format auth's askama templates with askama-analyzer"
run = "askama-analyzer fmt apps/auth"

[tasks."fmt:check"]
description = "Check formatting"
run = "oxfmt --check"

[tasks.typecheck]
description = "Type check every package"
# `-e` guards the globs: one that matches nothing is left unexpanded, and tsc
# would be handed the literal.
run = 'for p in packages/*/tsconfig.json apps/*/deploy/pulumi/tsconfig.json scripts/tsconfig.json; do [ -e "$p" ] || continue; echo "→ $p" && tsc -p "$p" || exit 1; done'

[tasks.test]
description = "Run the test suite (vitest on Node — Pulumi needs Node's v8)"
run = "vitest run"

[tasks.check]
description = "Everything CI checks"
# No `run` of its own. These are independent, so mise fans them out across
# its job pool instead of running a list in an order nothing requires — and a
# failure stops the dependents rather than the whole file.
depends = ["lint", "lint:workflows", "fmt:check", "typecheck", "test"]
[tasks."check:profiles"]
description = "Validate every profile shape against the real sing-box binary (needs docker)"
run = "./scripts/check-profiles.ts"
[tasks."update:apps"]
description = "Report or apply upstream version bumps"
run = "./scripts/update-apps/update-apps.ts"

# Config lives in the stack, credentials included, so these need a Pulumi login
# and nothing else. They wrap the CLI directly — what once made a shared
# entrypoint worth having was config assembly, and there is none left to share.
[tasks.preview]
description = "Preview the stack"
dir = "packages/infra"
run = "pulumi preview"

[tasks.deploy]
description = "Deploy the stack"
dir = "packages/infra"
run = "pulumi up"
