[tools]
aube = "1"
node = "24"
pulumi = "latest"
# rustfmt and clippy are not in the minimal profile mise installs by default,
# and the container workflows' check jobs need both.
rust = { version = "1", components = "rustfmt,clippy" }

[env]
# oxlint, oxfmt, tsc and vitest are workspace binaries. On PATH, a task can name
# the tool it runs instead of forwarding through the package manager to a
# package.json script that only forwards again.
_.path = ["node_modules/.bin"]

[tasks.auth]
description = "Write the GitHub Packages token .npmrc reads"
# Not an ${ENV} in .npmrc: aube refuses to expand environment variables in auth
# settings a project controls, because a checked-in .npmrc could otherwise
# exfiltrate the environment of anyone who installs. So the token goes in a
# gitignored file that .npmrc names. GH_TOKEN for CI, the gh login otherwise —
# either way nobody has to mint a PAT by hand.
run = '''
token="${GH_TOKEN:-$(gh auth token 2>/dev/null || true)}"
if [ -z "$token" ]; then
  echo "no GitHub token: run 'gh auth login', or set GH_TOKEN" >&2
  exit 1
fi
printf '//npm.pkg.github.com/:_authToken=%s\n' "$token" > .npmrc.auth
'''

[tasks.setup]
description = "Toolchain, dependencies and git hooks, from a fresh clone"
# `prepare` installs lefthook, so the hooks come with the dependencies. It
# no-ops under `CI`: a runner has no commits to lint, and a half-written
# `.git/hooks/pre-commit` is what broke the workflows that do commit.
run = "aube install"

[tasks.lint]
description = "Lint with oxlint"
run = "oxlint"

[tasks."lint:fix"]
description = "Lint and auto-fix"
run = "oxlint --fix"

[tasks.fmt]
description = "Format with oxfmt"
run = "oxfmt --write"

[tasks."fmt:check"]
description = "Check formatting"
run = "oxfmt --check"

[tasks.typecheck]
description = "Type check every package"
# `-e` guards the globs: an app with no browser TypeScript leaves
# apps/*/tsconfig*.json unexpanded, and tsc is handed the literal.
run = 'for p in packages/*/tsconfig.json apps/*/tsconfig*.json apps/*/deploy/pulumi/tsconfig.json scripts/tsconfig.json; do [ -e "$p" ] || continue; echo "→ $p" && tsc -p "$p" || exit 1; done'

[tasks.test]
description = "Run the test suite (vitest on Node — Pulumi needs Node's v8)"
run = "vitest run"

[tasks.check]
description = "Everything CI checks"
# No `run` of its own. These four are independent, so mise fans them out across
# its job pool instead of running a list in an order nothing requires — and a
# failure stops the dependents rather than the whole file.
depends = ["lint", "fmt:check", "typecheck", "test"]
[tasks."check:profiles"]
description = "Validate every profile shape against the real sing-box binary (needs docker)"
run = "./scripts/check-profiles.ts"
[tasks."update:apps"]
description = "Report or apply upstream version bumps"
run = "./scripts/update-apps/update-apps.ts"

# Config lives in the stack, credentials included, so these need a Pulumi login
# and nothing else. They wrap the CLI directly — what once made a shared
# entrypoint worth having was config assembly, and there is none left to share.
[tasks.preview]
description = "Preview the stack"
dir = "packages/infra"
run = "pulumi preview"

[tasks.up]
description = "deprecated: use deploy"
run = "echo '[301] moved -> mise deploy (mise shadows `up`)'"

[tasks.deploy]
description = "Deploy the stack"
dir = "packages/infra"
run = "pulumi up"
