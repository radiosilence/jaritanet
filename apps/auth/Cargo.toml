[package]
name = "auth"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.0"
axum = "0.8"
base64 = "0.23.1"
rand = "0.10.2"
redis = { version = "1.5", default-features = false, features = [
  "tokio-comp",
  "connection-manager",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "form",
  "json",
  "query",
  "rustls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
