{% extends "base.html" %}

{% block title %}Sign-in expired{% endblock %}

{% block content %}
<section class="card">
  <h1 class="mb-3 text-title-sm font-semibold text-strong wrap-anywhere">Sign-in expired</h1>
  <p class="muted">
    This sign-in is no longer in progress, usually because it took longer than
    ten minutes. Go back to the application and sign in again.
  </p>
</section>
{% endblock %}
