<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A login page has no business being indexed, and less being archived. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>{% block title %}auth{% endblock %}</title>
    <link rel="stylesheet" href="/assets/app.css" />
    {% block head %}{% endblock %}
  </head>
  <body class="flex min-h-dvh items-center justify-center p-6">
    <main class="w-full max-w-form">{% block content %}{% endblock %}</main>
  </body>
</html>
