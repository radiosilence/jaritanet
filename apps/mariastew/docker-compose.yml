# One-command local dev loop: `docker compose up --build`, then
# http://localhost:8080/auth/dev-login. The `seed` service below populates
# the picker before mariastew starts, so there is no separate step and no
# way to end up looking at an empty library that only looks like a working
# one. See README's "Local development" for what dev-login does and does
# not need, and Dockerfile.dev for why this builds a debug binary rather
# than reusing the production Dockerfile.
services:
  # Guarantees `docker compose up` alone gives a populated, realistic
  # library — an empty picker that looks like a working picker is worse
  # than an error, and "run this other command first" is how that happens.
  # Runs the same scripts/seed-dev-fixtures.ts as `mise run mariastew:seed`
  # (mounted read-only, single source of truth) against the same bind
  # mounts mariastew and aria2 use below, and exits; mariastew waits for it
  # to succeed before starting. Idempotent, so this costs nothing on a
  # second `up` and never touches a download already sitting in dev-data.
  # A plain node image rather than baking node into Dockerfile.dev: this
  # only ever runs on the host, never ships, and pinning it to the same
  # major version mise installs (see mise.toml) is enough to keep it in
  # step.
  seed:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - ./dev-data:/app/dev-data
    command: ["node", "--experimental-strip-types", "scripts/seed-dev-fixtures.ts"]

  # Owns the shared network namespace and the published port, mirroring the
  # pod: one image, two containers, aria2's RPC reachable only from
  # 127.0.0.1 inside it. aria2 below joins this network rather than getting
  # its own, so `ARIA2_RPC_URL`'s 127.0.0.1 is the same loopback for both.
  mariastew:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: mariastew-dev
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      # tv before movies, matching production's shape (see config.rs's own
      # tests) rather than a single flat root.
      ROOTS: "tv:/tv,movies:/movies"
      PUBLIC_URL: "http://localhost:8080"
      # Overridable so the mock below can be swapped in without editing this
      # file — see `mise run mariastew:dev:mock`.
      ARIA2_RPC_URL: "${ARIA2_RPC_URL:-http://127.0.0.1:6800/jsonrpc}"
      # Never actually reached: /auth/dev-login mints a session without
      # touching Hydra. Config::from_env still requires all three to be set.
      OIDC_ISSUER: "https://dev.invalid"
      OIDC_CLIENT_ID: "dev"
      OIDC_CLIENT_SECRET: "dev"
      RUST_LOG: "info,mariastew=debug"
    volumes:
      - ./dev-data/tv:/tv
      - ./dev-data/movies:/movies

  # Same image, run as aria2c instead of mariastew — see "One image, run
  # twice" in the README. `--rpc-listen-all=false` binds the RPC port to
  # loopback only, which is why this has to share mariastew's network
  # namespace rather than talk to it over a compose bridge network. Both
  # roots are mounted here too, same as production (`mounts` in
  # packages/mariastew/src/mariastew.ts) — a download can land in either.
  aria2:
    image: mariastew-dev
    depends_on:
      - mariastew
    network_mode: "service:mariastew"
    entrypoint:
      - /usr/bin/aria2c
      - --enable-rpc
      - --rpc-listen-all=false
      - --rpc-listen-port=6800
      - --dir=/tv
      - --continue=true
      - --check-integrity=true
      # Production sets this (see packages/mariastew/src/mariastew.ts) and the
      # add path is shaped around it: the followed download is created stopped
      # so the filter's selection lands before anything is fetched. Without it
      # here, local dev would exercise a different sequence from the one that
      # ships — and the one case that only shows up in the combination is the
      # kind this file exists to make visible.
      - --pause-metadata=true
      # Nothing is preallocated, so a file the filter rejected never touches
      # disk — see "Why files land straight in the library" in the README.
      - --file-allocation=none
      - --seed-ratio=0.0
      - --enable-dht=true
      - --bt-enable-lpd=true
      - --enable-peer-exchange=true
    volumes:
      - ./dev-data/tv:/tv
      - ./dev-data/movies:/movies

  # Opt-in (profile `mock`), and not a second aria2: it holds a list and
  # hands it out. See scripts/mock-aria2.ts for why the states it serves are
  # the ones a real swarm is worst at producing on demand.
  #
  # Port 6801 rather than 6800 so it never races the real aria2 for the bind,
  # which means the choice of which one mariastew talks to is `ARIA2_RPC_URL`
  # alone. `mise run mariastew:dev:mock` is that env var plus `--scale
  # aria2=0`, so the real one is not started at all.
  #
  # Same node image and read-only scripts mount as `seed` above — this only
  # ever runs on the host and never ships.
  mock-aria2:
    profiles: ["mock"]
    image: node:24-alpine
    working_dir: /app
    depends_on:
      - mariastew
    network_mode: "service:mariastew"
    environment:
      PORT: "6801"
      MOCK_DIR: "/tv"
    volumes:
      - ./scripts:/app/scripts:ro
    command:
      ["node", "--experimental-strip-types", "scripts/mock-aria2.ts"]
