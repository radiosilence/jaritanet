<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mariastew</title>
<link rel="stylesheet" href="/assets/app.css">
<script type="module" src="/assets/datastar.js"></script>
</head>
<body data-init="@get('/stream')" class="min-h-screen bg-base-200">

<header class="navbar bg-base-100 shadow-sm px-4">
  <h1 class="flex-1 text-lg font-semibold">mariastew</h1>
  <button type="button" class="btn btn-primary btn-sm min-h-11"
    data-on:click="document.getElementById('add-dialog').showModal()">Add download</button>
</header>

{% if aria2_unreachable %}
<div role="alert" class="alert alert-warning mx-4 mt-4">
  <span>Download service is unreachable — showing an empty list.</span>
</div>
{% endif %}

<!-- Bounded to the viewport and split into three regions so nothing about
     reaching them depends on how long the directory list under the current
     root happens to be (see browse.html): a pinned header carries the paste
     field — the first, primary action, always visible the moment this
     opens; only the middle region scrolls; Add and Cancel are pinned at the
     bottom, in a phone's thumb zone, never below a long list. `dvh` rather
     than `vh` because mobile Safari's collapsing toolbar makes `vh` wrong
     the moment the address bar shows or hides. -->
<dialog id="add-dialog" class="open:flex flex-col max-h-[90dvh] w-full max-w-sm rounded-box bg-base-100 shadow-xl backdrop:bg-black/50">
  <form id="add-form" class="flex min-h-0 flex-1 flex-col gap-3 overflow-y-auto p-6">
    <h2 class="text-lg font-semibold">Add a download</h2>
    <input name="magnet" required placeholder="magnet:?xt=..." class="input input-bordered w-full min-h-11" autofocus>
    {{ self.picker()?|safe }}
  </form>
  <div class="flex justify-end gap-2 border-t border-base-300 p-4">
    <form method="dialog">
      <button class="btn btn-ghost min-h-11">Cancel</button>
    </form>
    <!-- `selector` because this button lives outside #add-form — pinned in
         the footer rather than scrolling away with it — so Datastar is told
         explicitly which form to serialize instead of walking up from here
         and finding none. -->
    <button type="button" class="btn btn-primary min-h-11"
      data-on:click="@post('/add', {contentType: 'form', selector: '#add-form'})">Add</button>
  </div>
</dialog>

<main class="p-4 max-w-2xl mx-auto">
{% include "downloads.html" %}
</main>

</body>
</html>
