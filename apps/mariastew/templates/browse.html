<div id="picker" class="flex flex-col gap-2">
  <div class="flex items-start gap-2 text-sm">
    {% if let Some(p) = parent %}
    <button type="button" class="btn btn-sm btn-ghost min-h-11 min-w-11 shrink-0"
      data-on:click="@get('{{ crate::views::browse_href(p) }}')">↑ Up</button>
    {% endif %}
    <!-- Always shown, even at the roots, so where a download lands is never
         a guess — see #257, "keep the current path visible". Wrapped, not
         truncated: this is the one line whose whole job is saying exactly
         where a download will land, so hiding any of it defeats the point.
         `break-words` is the fallback for one path segment on its own
         wider than the dialog — a scene-release directory name can be. -->
    <span class="font-mono opacity-70 break-words min-w-0 flex-1">{% if path.is_empty() %}/{% else %}{{ path }}{% endif %}</span>
  </div>

  <!-- Bounded and internally scrolling: a root with a hundred-plus direct
       children (a real movie library, one folder per film) is one level of
       browsing, not a bug, and it must not push the rest of the dialog —
       the magnet field above, the Add/Cancel row below — off screen.

       Plain utilities rather than DaisyUI's `.menu`: `.menu` sizes itself
       to `width: fit-content` and lays each item out as a `display: grid`
       row with a `max-content` track, both built for a sidebar/dropdown
       that should hug its widest item — exactly backwards for a list that
       must wrap a name to the width it is given. `.menu`'s own item rule
       out-specifies a plain utility class, so overriding `display` on the
       link one property at a time turns into a losing fight with the
       component; a plain list styled by hand does not have that fight. -->
  <ul class="flex w-full max-h-[40vh] flex-col gap-1 overflow-y-auto rounded-box bg-base-200 p-2 text-sm">
    {% for d in dirs %}
    <!-- Wrapped with no line cap, not truncated with an ellipsis and not
         clamped to a fixed number of lines either. A real release name puts
         the title and year first and encoding detail last
         (`Chungking.Express.1994.Criterion.1080p.BluRay.x265...`), so an
         end-ellipsis usually only hides junk — except when two folders
         differ near the end (a part number, a disc, a cut), which is
         exactly the case a picker has to get right. A 2-line clamp was
         tried first and rejected: a name long enough to need three lines
         clips its third line right where a PART1/PART2-style suffix
         usually lives, which is the one case this whole choice exists to
         protect. Unbounded wrap costs list height on the rare very long
         name; the list already scrolls to absorb that, so nothing is ever
         hidden regardless of how long a name gets. -->
    <li><a class="block min-h-11 break-words rounded-field px-3 py-2 hover:bg-base-300"
      data-on:click="@get('{{ crate::views::browse_href(d.path.as_str()) }}')">{{ d.name }}</a></li>
    {% endfor %}
  </ul>

  <div class="flex gap-2">
    <input type="hidden" name="parent" value="{{ path }}">
    <input name="name" placeholder="New folder name" class="input input-bordered input-sm flex-1 min-h-11">
    <button type="button" class="btn btn-sm min-h-11"
      data-on:click="@post('/mkdir', {contentType: 'form'})">Create</button>
  </div>

  <input type="hidden" name="dir" value="{{ path }}">
</div>
